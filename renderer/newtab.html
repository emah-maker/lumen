<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:; form-action https:" />
  <title>New Tab</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --card: #f5f5f7; --field: rgba(0, 0, 0, 0.05); --hover: rgba(0, 0, 0, 0.06);
      --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2; --ring: rgba(0, 122, 255, 0.25);
      --border: rgba(0, 0, 0, 0.1); --accent: #007aff; --green: #34c759; --shadow: rgba(0, 0, 0, 0.14);
      --mono-l: 92%; --mono-t: 32%;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --bg: #f6f6fd; --card: rgba(255, 255, 255, 0.78); --accent: #5846ff; --ring: rgba(88, 70, 255, 0.28);
      --b1: #2f6bff; --b2: #7040ff; --b3: #e0338f; --b4: #ff9f1c;
      --aurora-a: 0.34; --aurora-b: 0.26;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --card: #2c2c2e; --field: rgba(255, 255, 255, 0.08); --hover: rgba(255, 255, 255, 0.08);
        --text: #f5f5f7; --muted: #98989d; --faint: #636366; --ring: rgba(10, 132, 255, 0.4);
        --border: rgba(255, 255, 255, 0.12); --accent: #0a84ff; --green: #30d158; --shadow: rgba(0, 0, 0, 0.55);
        --mono-l: 26%; --mono-t: 82%;
        --bg: #0a0b1c; --card: rgba(28, 30, 64, 0.72); --accent: #8475ff; --ring: rgba(132, 117, 255, 0.45);
        --b1: #4d8dff; --b2: #9466ff; --b3: #ff5cb0; --b4: #ffb347;
        --aurora-a: 0.42; --aurora-b: 0.32;
      }
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
    }
    ::selection { background: var(--ring); }
    /* Aurora: soft light drifting behind the page (still when reduced motion is on). */
    .aurora { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(60px) saturate(130%); }
    .aurora i { position: absolute; border-radius: 50%; opacity: var(--aurora-a); animation: drift 22s ease-in-out infinite alternate; }
    .aurora i:nth-child(1) { width: 55vmax; height: 45vmax; left: 8%; top: 4%; background: var(--b1); }
    .aurora i:nth-child(2) { width: 50vmax; height: 42vmax; right: 6%; top: 10%; background: var(--b2); animation-duration: 26s; animation-delay: -6s; }
    .aurora i:nth-child(3) { width: 42vmax; height: 36vmax; left: 38%; top: 36%; background: var(--b3); opacity: var(--aurora-b); animation-duration: 30s; animation-delay: -12s; }
    @keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); } }
    .brand { display: inline-flex; align-items: center; gap: 7px; margin: 0 0 18px; font-size: 13px; font-weight: 700; letter-spacing: -0.01em; }
    .brand::before { content: ""; width: 16px; height: 16px; border-radius: 5px; background: linear-gradient(135deg, var(--b1), var(--b2) 55%, var(--b3)); box-shadow: 0 4px 12px -4px var(--b2); }
    main { width: min(680px, 88vw); margin: 0 auto; padding: clamp(40px, 10vh, 120px) 0 48px; }

    header { margin-bottom: 18px; }
    .date { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
    h1 { margin: 4px 0 0; font-size: clamp(34px, 5.2vw, 46px); line-height: 1.05; font-weight: 800; letter-spacing: -0.035em; }
    h1 .glow { background: linear-gradient(120deg, var(--b1), var(--b2) 50%, var(--b3)); -webkit-background-clip: text; background-clip: text; color: transparent; }

    form { position: relative; margin-bottom: 30px; }
    form svg { position: absolute; left: 16px; top: 50%; width: 16px; height: 16px; margin-top: -8px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; z-index: 1; }
    input {
      width: 100%; box-sizing: border-box; height: 46px; padding: 0 64px 0 42px; border: none; border-radius: 14px;
      background: var(--card); color: var(--text); caret-color: var(--accent); font: inherit; font-size: 16px; letter-spacing: -0.01em; outline: none;
      backdrop-filter: blur(20px) saturate(160%); box-shadow: 0 0 0 1px var(--border), 0 14px 34px -22px var(--shadow);
      transition: background-color 200ms ease-out, box-shadow 320ms var(--ease);
    }
    input::placeholder { color: var(--muted); }
    /* Focus: a crisp accent ring plus a neutral elevation shadow (no coloured glow). */
    input:focus { background: var(--card); box-shadow: 0 0 0 1px var(--accent), 0 0 0 5px var(--ring), 0 18px 40px -22px var(--shadow); }
    kbd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%); min-width: 20px; padding: 1px 6px; border-radius: 6px;
      font: 600 11px/18px system-ui, sans-serif; color: var(--muted); text-align: center; box-shadow: inset 0 0 0 1px var(--border); transition: opacity 160ms ease-out;
    }
    input:focus ~ kbd, input:not(:placeholder-shown) ~ kbd { opacity: 0; }

    section { margin-top: 26px; }
    section:first-of-type { margin-top: 0; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 650; letter-spacing: -0.012em; }

    .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 10px; }
    .grid a {
      display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 2px; min-width: 0;
      border-radius: 12px; color: var(--muted); text-decoration: none; outline: none; transition: color 150ms ease-out;
    }
    .grid a:hover, .grid a:focus-visible { color: var(--text); }
    .name { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .tile {
      width: 62px; height: 62px; display: grid; place-items: center; border-radius: 17px; background: var(--card);
      font-size: 23px; font-weight: 700; letter-spacing: -0.02em; box-shadow: 0 0 0 0.5px var(--border), 0 10px 24px -16px var(--shadow);
      backdrop-filter: blur(16px) saturate(150%);
      transition: transform 420ms var(--ease), box-shadow 420ms var(--ease);
    }
    /* Monograms tinted per site (like Safari's), so sites that share a letter still look different. */
    .tile.mono { background: linear-gradient(150deg, hsl(var(--hue) 85% calc(var(--mono-l) - 4%)), hsl(calc(var(--hue) + 40) 80% calc(var(--mono-l) - 12%))); color: hsl(var(--hue) 60% var(--mono-t)); }
    .tile img { width: 28px; height: 28px; padding: 6px; border-radius: 9px; background: #ffffff; box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08); }
    .grid a:hover .tile { transform: translateY(-4px) scale(1.04); box-shadow: 0 0 0 0.5px var(--border), 0 16px 28px -14px var(--shadow); }
    .grid a:active .tile { transform: scale(0.94); transition-duration: 90ms; }
    .grid a:focus-visible .tile { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

    .frequent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .frequent a {
      display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 11px; border-radius: 12px;
      background: var(--card); color: var(--text); text-decoration: none; outline: none; backdrop-filter: blur(16px) saturate(150%);
      box-shadow: 0 0 0 0.5px var(--border);
      transition: transform 320ms var(--ease), box-shadow 320ms var(--ease);
    }
    .frequent a:hover { transform: translateY(-1px); box-shadow: 0 10px 22px -16px var(--shadow); }
    .frequent a:active { transform: scale(0.98); transition-duration: 90ms; }
    .frequent a:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .frequent .tile { width: 32px; height: 32px; border-radius: 9px; font-size: 14px; flex: none; }
    .frequent .tile img { width: 18px; height: 18px; padding: 3px; border-radius: 6px; }
    .frequent .text { min-width: 0; display: flex; flex-direction: column; }
    .frequent .title, .frequent .host { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .frequent .title { font-weight: 550; font-size: 12.5px; }
    .frequent .host { color: var(--muted); font-size: 11.5px; }

    .privacy { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); backdrop-filter: blur(16px) saturate(150%); box-shadow: 0 0 0 0.5px var(--border); }
    .privacy svg { flex: none; width: 26px; height: 26px; }
    .privacy strong { display: block; font-size: 13px; font-weight: 600; }
    .privacy span { color: var(--muted); font-size: 12px; }

    .empty { margin: 0; padding: 14px; border-radius: 14px; background: var(--card); color: var(--muted); }
    .empty kbd { position: static; transform: none; display: inline-block; margin: 0 2px; }

    /* Entrance: sections settle in one after another. */
    header, form, section { animation: rise 520ms var(--ease) backwards; }
    form { animation-delay: 40ms; }
    section:nth-of-type(1) { animation-delay: 90ms; }
    section:nth-of-type(2) { animation-delay: 140ms; }
    section:nth-of-type(3) { animation-delay: 190ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) {
      header, form, section { animation: fade 160ms ease-out backwards !important; animation-delay: 0ms !important; }
      .aurora i { animation: none; }
      .grid a:hover .tile, .frequent a:hover { transform: none; }
      @keyframes fade { from { opacity: 0; } }
    }
    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .frequent { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <main>
    <p class="brand">Lumen</p>
    <header>
      <p class="date" id="date"></p>
      <h1 id="greeting">Hello</h1>
    </header>
    <form action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="m10.6 10.6 3.4 3.4"/></svg>
      <input id="q" name="q" autocomplete="off" placeholder="Search Google" aria-label="Search Google" aria-keyshortcuts="/" />
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div id="sections"></div>
  </main>
  <script src="favicons.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
