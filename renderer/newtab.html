<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: file:; frame-src https:; form-action https:" />
  <title>New Tab</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --card: #f5f5f7; --field: rgba(0, 0, 0, 0.05); --hover: rgba(0, 0, 0, 0.06);
      --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2; --ring: rgba(0, 122, 255, 0.25);
      --border: rgba(0, 0, 0, 0.1); --accent: #007aff; --on-accent: #ffffff; --green: #248a3d; --shadow: rgba(0, 0, 0, 0.14);
      --mono-l: 92%; --mono-t: 32%;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --card: #2c2c2e; --field: rgba(255, 255, 255, 0.08); --hover: rgba(255, 255, 255, 0.08);
        --text: #f5f5f7; --muted: #98989d; --faint: #636366; --ring: rgba(10, 132, 255, 0.4);
        --border: rgba(255, 255, 255, 0.12); --accent: #0a84ff; --on-accent: #ffffff; --green: #30d158; --shadow: rgba(0, 0, 0, 0.55);
        --mono-l: 26%; --mono-t: 82%;
      }
    }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
    }
    ::selection { background: var(--ring); }
    main { width: min(640px, 88vw); margin: 0 auto; padding: clamp(40px, 12vh, 132px) 0 48px; }

    /* [look] Backgrounds (Settings → Appearance → New tab page). On anything but Plain, text turns
       light and the cards become frosted glass over the picture or gradient. */
    #backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    #backdrop::before, #backdrop::after { content: ""; position: absolute; inset: -20%; }
    body[data-bg="plain"] #backdrop { display: none; }
    body[data-bg="aurora"] #backdrop { background: #06121f; }
    body[data-bg="aurora"] #backdrop::before { background: radial-gradient(40% 50% at 20% 30%, rgba(46, 213, 170, 0.55), transparent 70%), radial-gradient(45% 55% at 75% 25%, rgba(94, 92, 230, 0.55), transparent 70%), radial-gradient(50% 50% at 55% 85%, rgba(191, 90, 242, 0.4), transparent 70%); filter: blur(30px); animation: drift 28s var(--ease) infinite alternate; }
    body[data-bg="dusk"] #backdrop { background: linear-gradient(160deg, #1d1b4b 0%, #5b2a86 45%, #d9577b 80%, #f7a26a 100%); }
    body[data-bg="ocean"] #backdrop { background: linear-gradient(160deg, #031b34 0%, #0a4a7a 45%, #0e8fa8 80%, #6fd6c8 100%); }
    body[data-bg="forest"] #backdrop { background: linear-gradient(160deg, #07170f 0%, #164430 45%, #2f7d4f 80%, #9fcf7a 100%); }
    body[data-bg="sunset"] #backdrop { background: linear-gradient(160deg, #2a0d2e 0%, #8a1f4b 40%, #f0584a 75%, #ffc26b 100%); }
    body[data-bg="graphite"] #backdrop { background: radial-gradient(120% 90% at 50% 0%, #3a3a3c 0%, #1c1c1e 60%, #111 100%); }
    body[data-bg="dusk"] #backdrop::before, body[data-bg="ocean"] #backdrop::before, body[data-bg="forest"] #backdrop::before, body[data-bg="sunset"] #backdrop::before {
      background: radial-gradient(35% 40% at 80% 20%, rgba(255, 255, 255, 0.16), transparent 70%), radial-gradient(40% 45% at 15% 80%, rgba(255, 255, 255, 0.08), transparent 70%);
      animation: drift 36s var(--ease) infinite alternate;
    }
    /* [look] An animated effect (newtab-effects.js) sits over the background, under everything else. */
    #effect {
      position: fixed; inset: 0; z-index: -1; width: 100vw; height: 100vh; pointer-events: none;
      /* It never takes a click. It fades behind the content column (newtab-effects.js draws that fade into
         the canvas: a CSS mask on a canvas that redraws every frame is repainted every frame and, with the
         blur behind the cards below, left vertical bands on some graphics cards). */
    }
    @media (max-width: 760px) { #effect { opacity: 0.35; } }
    /* Over an effect the search box, switch and cards are less see-through. */
    body.on-media.has-effect input:not(:focus) { background: rgba(28, 28, 32, 0.78); }
    body.on-media.has-effect .w-card, body.on-media.has-effect .privacy,
    body.on-media.has-effect .frequent a, body.on-media.has-effect .mode { background: rgba(28, 28, 32, 0.68); }
    /* No blur behind them while an effect animates: the blur re-samples the moving canvas every frame. */
    body.on-media.has-effect input, body.on-media.has-effect .frequent a, body.on-media.has-effect .privacy,
    body.on-media.has-effect .mode, body.on-media.has-effect .empty, body.on-media.has-effect .w-card {
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    body[data-bg="image"] #backdrop { background: #000 var(--wallpaper) center / cover no-repeat; }
    body[data-bg="image"] #backdrop::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.12) 40%, rgba(0, 0, 0, 0.45) 100%); inset: 0; }
    @keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 2%, 0) scale(1.08); } }
    body.on-media {
      --text: #ffffff; --muted: rgba(255, 255, 255, 0.72); --faint: rgba(255, 255, 255, 0.5); --card: rgba(255, 255, 255, 0.12);
      --field: rgba(255, 255, 255, 0.16); --hover: rgba(255, 255, 255, 0.14); --border: rgba(255, 255, 255, 0.22); --bg: rgba(20, 20, 24, 0.55);
      --mono-l: 30%; --mono-t: 88%;
      background: #000; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.25);
    }
    body.on-media input, body.on-media .frequent a, body.on-media .privacy, body.on-media .mode, body.on-media .empty, body.on-media .w-card {
      -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
    }
    body.on-media input { background: rgba(255, 255, 255, 0.16); color: #fff; box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.22); }
    body.on-media input:focus { background: rgba(20, 20, 24, 0.62); }
    body.on-media .frequent a, body.on-media .privacy, body.on-media .w-card { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.16); }
    /* The clock: large, light, and steady (tabular digits don't jitter as minutes change). */
    .clock { margin: 0 0 4px; font-size: clamp(56px, 9vw, 88px); line-height: 1; font-weight: 200; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .clock[hidden] { display: none; }
    main { animation: arrive 700ms var(--ease) both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      main, #backdrop::before { animation: none !important; }
    }

    header { margin-bottom: 20px; }
    .date { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
    h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; }

    form { position: relative; margin-bottom: 32px; }
    form > svg { position: absolute; left: 15px; top: 23px; width: 16px; height: 16px; margin-top: -8px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
    input {
      width: 100%; box-sizing: border-box; height: 46px; padding: 0 44px 0 40px; border: none; border-radius: 12px;
      background: var(--card); color: var(--text); caret-color: var(--accent); font: inherit; font-size: 15px; letter-spacing: -0.01em; outline: none;
      box-shadow: 0 0 0 1px var(--border);
      transition: box-shadow 240ms var(--ease);
    }
    input::placeholder { color: var(--muted); }
    input:focus { background: var(--bg); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--ring); }
    form > kbd {
      position: absolute; right: 12px; top: 23px; transform: translateY(-50%); min-width: 20px; padding: 1px 6px; border-radius: 6px;
      font: 600 11px/18px system-ui, sans-serif; color: var(--muted); text-align: center; box-shadow: inset 0 0 0 1px var(--border); transition: opacity 160ms ease-out;
    }
    input:focus ~ kbd, input:not(:placeholder-shown) ~ kbd { opacity: 0; }

    /* Search | Ask AI: a quiet two-option switch under the field. */
    .mode { display: inline-flex; gap: 2px; margin-top: 10px; padding: 2px; border-radius: 9px; background: var(--field); }
    .mode button {
      appearance: none; border: none; margin: 0; padding: 4px 12px; border-radius: 7px; background: transparent; color: var(--muted);
      font: 500 12px/18px system-ui, sans-serif; cursor: default; outline: none; transition: background-color 160ms ease-out, color 160ms ease-out;
    }
    .mode button:hover { color: var(--text); }
    .mode button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
    .mode button:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .mode-hint { margin-left: 8px; font-size: 11.5px; color: var(--muted); }

    section { margin-top: 28px; }
    section:first-of-type { margin-top: 0; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }

    .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 10px; }
    .grid a {
      display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 2px; min-width: 0;
      border-radius: 12px; color: var(--muted); text-decoration: none; outline: none; transition: color 150ms ease-out;
    }
    .grid a:hover, .grid a:focus-visible { color: var(--text); }
    .name { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .tile {
      width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: var(--card);
      font-size: 20px; font-weight: 600; letter-spacing: -0.02em; box-shadow: 0 0 0 0.5px var(--border);
      transition: transform 360ms var(--ease), box-shadow 360ms var(--ease);
    }
    /* Monograms tinted per site (like Safari's), so sites that share a letter still look different. */
    .tile.mono { background: hsl(var(--hue) 70% var(--mono-l)); color: hsl(var(--hue) 55% var(--mono-t)); box-shadow: none; }
    .tile img { width: 28px; height: 28px; border-radius: 6px; }
    .grid a:hover .tile { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--border), 0 8px 18px -10px var(--shadow); }
    .grid a:active .tile { transform: scale(0.95); transition-duration: 90ms; }
    .grid a:focus-visible .tile { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

    .frequent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .frequent a {
      display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 11px; border-radius: 12px;
      background: var(--card); color: var(--text); text-decoration: none; outline: none;
      transition: transform 280ms var(--ease), box-shadow 280ms var(--ease);
    }
    .frequent a:hover { background: var(--hover); }
    .frequent a:active { transform: scale(0.98); transition-duration: 90ms; }
    .frequent a:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .frequent .tile { width: 30px; height: 30px; border-radius: 8px; font-size: 13px; flex: none; box-shadow: none; background: transparent; }
    .frequent .tile.mono { background: hsl(var(--hue) 70% var(--mono-l)); }
    .frequent .tile img { width: 18px; height: 18px; border-radius: 4px; }
    .frequent .text { min-width: 0; display: flex; flex-direction: column; }
    .frequent .title, .frequent .host { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .frequent .title { font-weight: 550; font-size: 12.5px; }
    .frequent .host { color: var(--muted); font-size: 11.5px; }

    .privacy { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--card); }
    .privacy svg { flex: none; width: 22px; height: 22px; }
    .privacy strong { display: block; font-size: 13px; font-weight: 600; }
    .privacy span { color: var(--muted); font-size: 12px; }

    .empty { margin: 0; padding: 14px; border-radius: 12px; background: var(--card); color: var(--muted); }
    .empty kbd { display: inline-block; margin: 0 2px; padding: 0 5px; border-radius: 5px; font: 600 11px/18px system-ui, sans-serif; box-shadow: inset 0 0 0 1px var(--border); }

    /* Entrance: sections settle in one after another. */
    header, form, section { animation: rise 480ms var(--ease) backwards; }
    form { animation-delay: 40ms; }
    section:nth-of-type(1) { animation-delay: 80ms; }
    section:nth-of-type(2) { animation-delay: 120ms; }
    section:nth-of-type(3) { animation-delay: 160ms; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      header, form, section { animation: fade 160ms ease-out backwards !important; animation-delay: 0ms !important; }
      .grid a:hover .tile, .frequent a:active, .grid a:active .tile { transform: none; }
      @keyframes fade { from { opacity: 0; } }
    }

    /* [widgets] Cards fed by the browser (features/widgets.js): weather, tasks, a calendar, a web
       page. They sit on a 12-column grid over the whole page (newtab-widgets-grid.js positions them
       with transforms; the centre column stays clear), and each card is a size container: what it
       shows depends on the room it has. Everything in them is set as text. */
    body { position: relative; display: flow-root; } /* flow-root: the centre column's margin (a banner above it) must not slide the whole page */
    main { transition: margin-top 260ms var(--ease); }
    .widgets { position: absolute; top: 0; left: 0; width: 100%; height: 0; pointer-events: none; z-index: 1; }
    .widgets.empty { display: none; }
    .w-card {
      --cloud: #c5cbd3; --drop: #2f8cff; --sun: #ffb21a; --moon: #b8b5ff; --warn: #d70015;
      position: absolute; left: 0; top: 0; box-sizing: border-box; display: flex; flex-direction: column; min-width: 0; padding: 12px 14px 14px; border-radius: 16px;
      background: var(--card); box-shadow: 0 0 0 0.5px var(--border); container-type: size; container-name: card; pointer-events: auto;
      transition: transform 260ms var(--ease), box-shadow 200ms var(--ease), scale 200ms var(--ease);
    }
    .w-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) { .w-card { --cloud: #9aa1ab; --drop: #64b5ff; --moon: #c9c7ff; --warn: #ff6961; } }
    body.on-media .w-card { --cloud: #eef1f5; --drop: #8fd0ff; --warn: #ff8a80; }
    .w-instant .w-card, .w-instant .w-ghost, body.calm .w-card, body.calm .w-ghost, body.calm main { transition: none; }
    .w-head { display: flex; align-items: center; gap: 8px; min-height: 22px; margin-bottom: 8px; touch-action: none; user-select: none; flex: none; }
    .w-head a, .w-head button:not(.w-grip) { cursor: default; }
    .w-body { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; scrollbar-width: thin; }
    .w-card.weather .w-body, .w-card.embed .w-body { overflow: hidden; }
    .w-foot { flex: none; display: none; margin-top: 6px; color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .w-foot.warn { color: var(--warn); }
    .w-foot:empty { display: none !important; }
    @container card (min-height: 190px) { .w-foot { display: block; } }
    /* Moving and resizing: a grip before the title and a corner handle, shown on hover; edit mode
       adds a handle on every corner and edge, a remove badge, a gear and size presets. */
    .w-grip, .w-resize { appearance: none; flex: none; margin: 0; padding: 0; border: 0; background: transparent; color: var(--faint); opacity: 0; outline: none; transition: opacity 150ms ease-out, color 150ms ease-out, background-color 150ms ease-out; cursor: grab; }
    .w-grip { display: grid; place-items: center; width: 14px; height: 22px; margin: 0 -4px 0 -8px; border-radius: 5px; }
    .w-grip svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
    .w-resize { position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; border-radius: 0 0 14px 4px; cursor: nwse-resize; touch-action: none; z-index: 2; }
    .w-resize svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
    .w-card:hover .w-grip, .w-card:hover .w-resize, .w-grip:focus-visible, .w-resize:focus-visible, .w-card.resizing .w-resize, body.w-editing .w-resize { opacity: 1; }
    .w-grip:hover, .w-resize:hover, .w-card.resizing .w-resize { color: var(--text); }
    .w-grip:focus-visible, .w-resize:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
    .w-h, .w-remove, .w-gear, .w-presets { display: none; }
    .w-h { position: absolute; z-index: 2; touch-action: none; }
    .w-h[data-dir="n"], .w-h[data-dir="s"] { left: 16px; right: 16px; height: 10px; cursor: ns-resize; }
    .w-h[data-dir="e"], .w-h[data-dir="w"] { top: 16px; bottom: 16px; width: 10px; cursor: ew-resize; }
    .w-h[data-dir="n"] { top: -5px; } .w-h[data-dir="s"] { bottom: -5px; } .w-h[data-dir="e"] { right: -5px; } .w-h[data-dir="w"] { left: -5px; }
    .w-h[data-dir="ne"], .w-h[data-dir="nw"], .w-h[data-dir="sw"] { width: 14px; height: 14px; }
    .w-h[data-dir="ne"] { right: -6px; top: -6px; cursor: nesw-resize; } .w-h[data-dir="nw"] { left: -6px; top: -6px; cursor: nwse-resize; } .w-h[data-dir="sw"] { left: -6px; bottom: -6px; cursor: nesw-resize; }
    .w-h::after { content: ""; position: absolute; inset: 0; margin: auto; border-radius: 999px; background: var(--accent); opacity: 0.85; }
    .w-h[data-dir="n"]::after, .w-h[data-dir="s"]::after { width: 28px; height: 4px; }
    .w-h[data-dir="e"]::after, .w-h[data-dir="w"]::after { width: 4px; height: 28px; }
    .w-h[data-dir="ne"]::after, .w-h[data-dir="nw"]::after, .w-h[data-dir="sw"]::after { width: 9px; height: 9px; }
    body.w-editing .w-h { display: block; }
    body.w-editing .w-remove, body.w-editing .w-gear { display: grid; }
    body.w-editing .w-presets { display: none; }
    body.w-editing .w-card:hover .w-presets, body.w-editing .w-card:focus-within .w-presets { display: flex; }
    .w-remove, .w-gear { position: absolute; z-index: 3; place-items: center; width: 22px; height: 22px; margin: 0; padding: 0; border: 0; border-radius: 50%; background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border), 0 2px 8px var(--shadow); cursor: default; outline: none; }
    .w-remove { left: -8px; top: -8px; } .w-gear { right: -8px; top: -8px; }
    .w-remove svg, .w-gear svg { width: 11px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; }
    .w-remove:hover, .w-gear:hover { background: var(--hover); }
    .w-remove.armed { background: #d70015; color: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px #d70015; }
    .w-remove:focus-visible, .w-gear:focus-visible, .w-presets button:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .w-presets { position: absolute; z-index: 3; left: 10px; bottom: 8px; gap: 3px; padding: 3px; border-radius: 10px; background: var(--bg); box-shadow: 0 0 0 1px var(--border), 0 4px 14px var(--shadow); }
    .w-presets button { appearance: none; margin: 0; padding: 2px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); font: 500 11px/16px system-ui, sans-serif; cursor: default; outline: none; }
    .w-presets button:hover { background: var(--hover); }
    body.w-editing .w-card { touch-action: none; cursor: grab; user-select: none; }
    body.w-editing .w-card * { pointer-events: none; }
    body.w-editing .w-card .w-h, body.w-editing .w-card .w-resize, body.w-editing .w-card .w-remove, body.w-editing .w-card .w-gear, body.w-editing .w-card .w-presets, body.w-editing .w-card .w-presets * { pointer-events: auto; }
    /* Wiggle like a home screen; a plain outline instead with Reduce motion or Performance mode. */
    @keyframes wiggle { from { rotate: -0.45deg; } to { rotate: 0.45deg; } }
    @media (prefers-reduced-motion: no-preference) {
      body.w-editing:not(.calm) .w-card:not(.lifted):not(.resizing) { animation: wiggle 170ms ease-in-out infinite alternate; }
      body.w-editing:not(.calm) .w-card:nth-child(2n):not(.lifted):not(.resizing) { animation-delay: -85ms; animation-direction: alternate-reverse; }
    }
    body.w-editing.calm .w-card { outline: 2px dashed color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { body.w-editing .w-card { outline: 2px dashed color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 3px; } }
    .w-card.pressing { scale: 0.97; transition: scale 380ms ease-out, transform 260ms var(--ease); }
    body.w-dragging, body.w-dragging * { user-select: none; }
    body.w-dragging iframe { pointer-events: none; } /* a frame under the pointer would swallow the drag */
    .w-card.lifted { z-index: 4; cursor: grabbing; transition: box-shadow 200ms var(--ease); box-shadow: 0 0 0 1px var(--accent), 0 18px 40px -14px var(--shadow); }

    .td-next { font-size: 12.5px; font-weight: 500; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .td-full { display: none; flex-direction: column; }
    @container card (min-width: 190px) and (min-height: 130px) { .td-summary { display: none; } .td-full { display: flex; } }
    .td-meta { display: none; flex-wrap: wrap; align-items: center; gap: 0 8px; color: var(--muted); font-size: 11.5px; }
    .td-desc { display: none; color: var(--muted); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    @container card (min-width: 260px) { .td-meta { display: flex; } }
    @container card (min-width: 300px) and (min-height: 230px) { .td-desc { display: block; } }
    .td-rec svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; vertical-align: -1px; }
    .td-proj i { display: inline-block; width: 8px; height: 8px; margin-right: 4px; border-radius: 50%; background: var(--faint); }
    .td-label { color: var(--muted); }
    .dense .w-row { padding: 2px 6px; }
    .dense .w-day { padding-top: 5px; }
    .td-done { margin-top: 6px; } .td-done-row { padding: 2px 0; color: var(--muted); font-size: 12px; text-decoration: line-through; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .td-add { display: flex; gap: 6px; align-items: center; margin: 0 0 8px; }

    .td-toast { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 3; display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 12px; border-radius: 10px; background: var(--text); color: var(--bg); font-size: 12px; box-shadow: 0 6px 18px var(--shadow); }

    .td-toast .w-btn { margin: 0; padding: 2px 10px; background: rgba(128, 128, 128, 0.3); color: inherit; }

    /* Gmail (read-only): the unread count, then the latest messages; a small card shows the count and the newest one. */
    .gm-head { display: flex; align-items: baseline; gap: 6px; margin: 0 0 4px; }
    .gm-count { font-size: 34px; line-height: 1; font-weight: 250; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .gm-of { color: var(--muted); font-size: 11.5px; }
    .gm-row .w-main { min-width: 0; }
    .gm-from { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11.5px; color: var(--muted); }
    .gm-row.unread .gm-from { color: var(--text); font-weight: 600; }
    .gm-row .w-title, .gm-row a { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .gm-snip { display: none; color: var(--muted); font-size: 11.5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .gm-row .gm-when { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 1px; }
    @container card (min-width: 260px) and (min-height: 200px) { .gm-snip { display: block; } }
    @container card (max-height: 149px) { .gm-row.later { display: none; } }
    /* GitHub: the numbers on a small card, the lists on a bigger one. */
    .gh-summary { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 18px; min-height: 0; flex: 1 1 auto; align-content: center; }
    .gh-stat { display: flex; flex-direction: column; color: inherit; text-decoration: none; }
    .gh-num { font-size: 30px; line-height: 1; font-weight: 250; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .gh-of { color: var(--muted); font-size: 11.5px; }
    .gh-full { display: none; flex-direction: column; gap: 6px; }
    @container card (min-width: 220px) and (min-height: 150px) { .gh-summary { display: none; } .gh-full { display: flex; } }
    .gh-unread { margin: 0 0 2px; padding: 0 6px; font-size: 12.5px; font-weight: 500; }
    .gh-section { display: flex; flex-direction: column; }
    .gh-kind { flex: none; align-self: flex-start; margin-top: 2px; padding: 1px 6px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: 0.03em; text-transform: uppercase; }
    .gh-kind.draft { opacity: 0.7; }
    .gh-meta { display: none; flex-wrap: wrap; gap: 0 8px; color: var(--muted); font-size: 11.5px; }
    @container card (min-width: 260px) { .gh-meta { display: flex; } }
    .gh-repo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    /* Muse: the answer scrolls, the question field stays at the bottom. */
    .muse-card .w-body { display: flex; flex-direction: column; min-height: 0; }
    .mu-wrap { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .mu-p { margin: 0 0 6px; font-size: 12.5px; line-height: 1.45; white-space: pre-line; overflow-wrap: anywhere; }
    .mu-sources { margin: 4px 0 6px; padding: 0; list-style: none; font-size: 11.5px; }
    .mu-sources li { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .mu-ask { display: flex; gap: 6px; align-items: center; margin: 8px 0 0; flex: none; }
    .mu-ask input { flex: 1 1 auto; width: auto; min-width: 0; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; }
    .mu-ask .w-btn { margin: 0; flex: none; }
    /* Stocks and Crypto: a price table and a simulated paper portfolio. Direction is always shown with ▲/▼ as well as colour. */
    .w-card.stocks, .w-card.crypto { --up: #17772f; --down: #c4262e; }
    @media (prefers-color-scheme: dark) { .w-card.stocks, .w-card.crypto { --up: #4bd166; --down: #ff7a72; } }
    body.on-media .w-card.stocks, body.on-media .w-card.crypto { --up: #6ce085; --down: #ff9a94; }
    .w-card.stocks .w-body, .w-card.crypto .w-body { overflow: auto; }
    .mk-badge { flex: none; padding: 1px 7px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 10.5px; font-weight: 600; }
    .mk-badge.live { color: var(--up); } .mk-badge.off { color: var(--warn); }
    .mk-tabs { display: flex; gap: 2px; margin: 0 0 6px; }
    .mk-tab { appearance: none; border: 0; padding: 2px 9px; border-radius: 7px; background: transparent; color: var(--muted); font: 600 11px/18px system-ui, sans-serif; cursor: default; outline: none; }

    .mk-panel[hidden] { display: none; }
    .mk-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .mk-table th, .mk-table td { padding: 3px 4px; text-align: right; font-weight: 400; white-space: nowrap; }
    .mk-table thead th { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .mk-table th:first-child { text-align: left; }
    .mk-table tbody th.mk-sym { font-weight: 650; color: var(--text); }
    .mk-chg.up { color: var(--up); } .mk-chg.down { color: var(--down); } .mk-chg.flat { color: var(--muted); }
    .mk-foot { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; }
    .mk-paper-note { margin: 0 0 6px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
    .mk-sum { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 6px; }

    /* A web page in a frame (no Lumen privileges: sandboxed, no referrer) fills its box, or a card that opens it. */
