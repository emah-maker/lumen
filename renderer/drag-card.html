<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- The card that follows the cursor while a tab is dragged out of the strip (main.js "dragging a tab
       out"). A transparent, click-through window: the page snapshot, the tab's icon and title. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: https:" />
  <title>Lumen tab</title>
  <style>
    :root {
      --pad: 36px;
      --surface: rgba(255, 255, 255, 0.97); --text: #1d1d1f; --muted: #6e6e73;
      --edge: rgba(0, 0, 0, 0.08); --page: #ffffff; --accent: #007aff;
      --shadow: 0 18px 40px -8px rgba(0, 0, 0, 0.28), 0 4px 12px -2px rgba(0, 0, 0, 0.12);
      --spring: cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root.dark {
      --surface: rgba(44, 44, 46, 0.97); --text: #f5f5f7; --muted: #98989d;
      --edge: rgba(255, 255, 255, 0.12); --page: #1c1c1e; --accent: #0a84ff;
      --shadow: 0 18px 44px -8px rgba(0, 0, 0, 0.6), 0 4px 12px -2px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; overflow: hidden; height: 100%; }
    body { font: 12.5px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
    .card {
      position: absolute; left: var(--pad); top: var(--pad); width: calc(100% - var(--pad) * 2);
      border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 0.5px var(--edge);
      transform-origin: 26px 18px; opacity: 0; transform: scale(0.94);
      transition: opacity 180ms ease-out, transform 260ms var(--spring), width 240ms var(--spring), border-radius 240ms var(--spring);
    }
    .card.on { opacity: 1; transform: none; }
    .head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; }
    .icon { width: 16px; height: 16px; flex: none; border-radius: 4px; object-fit: contain; }
    .icon.blank { background: var(--edge); }
    .title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .shot { position: relative; height: var(--shot-h, 180px); background: var(--page); border-top: 0.5px solid var(--edge); transition: height 240ms var(--spring), opacity 160ms ease-out; }
    .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top left; opacity: 0; transition: opacity 140ms ease-out; }
    .shot img.loaded { opacity: 1; }
    /* Over a tab strip: the card becomes the tab it will be there. */
    .card.compact { width: 220px; border-radius: 10px; }
    .card.compact .shot { height: 0; opacity: 0; }
    .card.compact .head::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
    /* The drag ends: into a window of its own (the window fades in where the card is), into a strip, or back. */
    .card.drop { opacity: 0; transform: scale(1.04); transition: opacity 160ms ease-out, transform 200ms var(--spring); }
    .card.join { opacity: 0; transform: scale(0.9); transition: opacity 120ms ease-out, transform 160ms ease-out; }
    .card.cancel { opacity: 0; transform: scale(0.9) translateY(-6px); transition: opacity 140ms ease-out, transform 180ms ease-out; }
    @media (prefers-reduced-motion: reduce) {
      .card, .card *, .card.drop, .card.join, .card.cancel { transition-duration: 1ms !important; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head"><img class="icon blank" id="icon" alt="" /><span class="title" id="title"></span></div>
    <div class="shot"><img id="shot" alt="" /></div>
  </div>
  <script src="drag-card.js"></script>
</body>
</html>
