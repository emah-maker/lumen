<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data: crx:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Lumen</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="extras.css" /><!-- Claude Code engine, page context chip, panel snapshot -->
  <link rel="stylesheet" href="prefs.css" /><!-- [settings] -->
</head>
<body class="sidebar-hidden">
  <header class="chrome">
    <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Tabs">
      <div id="tabs" class="tabs"></div>
      <button class="icon-btn new-tab" id="new-tab" title="New tab (Ctrl+T)" aria-label="New tab">
        <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
      </button>
      <button class="organize-tabs" id="organize-tabs" type="button" hidden title="Group open tabs by topic with AI" aria-label="Organize tabs with AI">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5l1.3 3.2L12.5 7l-3.2 1.3L8 11.5 6.7 8.3 3.5 7l3.2-1.3z"/></svg>
        <span>Organize</span>
      </button>
    </div>

    <nav class="toolbar">
      <div class="toolbar-start">
        <button class="icon-btn" id="back" title="Back (Alt+Left)" aria-label="Back">
          <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="forward" title="Forward (Alt+Right)" aria-label="Forward">
          <svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
        </button>
      </div>

      <form class="omnibox" id="omnibox">
        <span class="security" id="security" hidden></span>
        <input id="address" type="text" spellcheck="false" autocomplete="off"
               placeholder="Search or enter address" aria-label="Address" />
        <div class="omnibox-end">
          <button class="zoom-pill" id="zoom" type="button" title="Reset zoom (Ctrl+0)" hidden></button>
          <button class="omnibox-action star" id="bookmark" type="button" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page" aria-pressed="false" hidden>
            <svg viewBox="0 0 16 16"><path d="M8 2.2l1.75 3.6 3.95.55-2.87 2.77.7 3.93L8 11.2l-3.53 1.85.7-3.93L2.3 6.35l3.95-.55Z"/></svg>
          </button>
          <button class="omnibox-action reload" id="reload" type="button" title="Reload (Ctrl+R)" aria-label="Reload">
            <svg viewBox="0 0 16 16" id="reload-icon"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.5V5h-2.5"/></svg>
          </button>
        </div>
      </form>

      <div class="toolbar-end">
        <div class="agent-pill" id="agent-pill" role="status">
          <span class="agent-dot" aria-hidden="true"></span>
          <span id="agent-pill-text">Lumen is using this tab</span>
          <button type="button" id="agent-stop">Stop</button>
        </div>
        <button class="icon-btn download-btn" id="downloads" type="button" aria-label="Downloads" hidden>
          <svg viewBox="0 0 24 24" class="download-ring" aria-hidden="true">
            <circle class="ring-track" cx="12" cy="12" r="10"/>
            <circle class="ring-bar" cx="12" cy="12" r="10"/>
          </svg>
          <svg viewBox="0 0 16 16" class="download-arrow" aria-hidden="true"><path d="M8 3v7M5 7.5 8 10.5l3-3M4.5 13h7"/></svg>
        </button>
        <browser-action-list id="extension-actions" alignment="bottom right"></browser-action-list>
        <button class="icon-btn" id="toggle-sidebar" title="AI (Ctrl+J)" aria-label="AI assistant" aria-pressed="false">
          <svg viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11M4.1 4.1l7.8 7.8M11.9 4.1l-7.8 7.8"/></svg>
        </button>
        <button class="icon-btn" id="app-menu" title="Menu" aria-label="Menu">
          <svg viewBox="0 0 16 16" class="dots"><circle cx="3.5" cy="8" r="1.1"/><circle cx="8" cy="8" r="1.1"/><circle cx="12.5" cy="8" r="1.1"/></svg>
        </button>
      </div>
    </nav>

    <div class="findbar" id="findbar" hidden>
      <div class="findbar-inner">
        <input id="find-input" type="text" spellcheck="false" placeholder="Find in page" aria-label="Find in page" />
        <span class="find-count" id="find-count" aria-live="polite"></span>
        <button class="icon-btn" id="find-prev" title="Previous (Shift+Enter)" aria-label="Previous match">
          <svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg>
        </button>
        <button class="icon-btn" id="find-next" title="Next (Enter)" aria-label="Next match">
          <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <button class="icon-btn" id="find-close" title="Close (Esc)" aria-label="Close find bar">
          <svg viewBox="0 0 16 16"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
    </div>
    </div>
    <div class="loadbar" id="loadbar" hidden></div>
  </header>

  <main class="body">
    <div id="viewport" class="viewport"></div>

    <aside id="sidebar" class="sidebar" aria-label="AI assistant">
      <div class="sidebar-resize" id="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" tabindex="0"></div>
      <div class="sidebar-head">
        <div class="model-picker">
          <select id="model" aria-label="Model"></select>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.5 8 9.5l3-3"/></svg>
        </div>
        <div class="sidebar-actions">
          <button class="icon-btn" id="new-chat" title="New chat" aria-label="New chat">
            <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
          </button>
          <button class="icon-btn" id="open-settings" title="AI settings (opens Settings)" aria-label="AI settings">
            <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 11.5h11"/><circle cx="10.5" cy="4.5" r="1.75" class="knob"/><circle cx="5.5" cy="11.5" r="1.75" class="knob"/></svg>
          </button>
        </div>
      </div>

      <div id="messages" class="messages" aria-live="polite">
        <div class="empty" id="empty">
          <p class="empty-title">Ask anything, or give Lumen a task on this page.</p>
          <div class="setup" id="setup" hidden>
            <p class="setup-title">Set up an AI</p>
            <button class="setup-option" type="button" id="setup-claude-code">
              <span class="setup-name">Use your Claude account</span>
              <span class="setup-detail" id="setup-claude-code-detail">Through Claude Code, with your own login (including school or work).</span>
            </button>
            <button class="setup-option" type="button" id="setup-keys">
              <span class="setup-name">API key or OpenRouter</span>
              <span class="setup-detail">Anthropic, OpenAI, Grok or Gemini keys, or sign in with OpenRouter.</span>
            </button>
          </div>
          <div class="chips">
            <button class="chip" data-prompt="Summarize this page.">Summarize this page</button>
            <button class="chip" data-prompt="What are the key takeaways from this page?">Key takeaways</button>
            <button class="chip" data-prompt="Explain this page in simple terms.">Explain simply</button>
          </div>
        </div>
      </div>

      <form id="composer" class="composer">
        <div class="attachments" id="attachments" hidden></div>
        <textarea id="prompt" rows="1" placeholder="Ask anything…" aria-label="Message the AI assistant"></textarea>
        <button class="send" id="send" type="submit" title="Send (Enter)" aria-label="Send" disabled>
          <svg viewBox="0 0 16 16"><path d="M8 12.5v-9M4 7.5 8 3.5l4 4"/></svg>
        </button>
      </form>
    </aside>
  </main>

  <script src="markdown.js"></script>
  <script src="picker.js"></script>
  <script src="app.js"></script>
  <script src="extras.js"></script>
</body>
</html>
