<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title>Privacy error</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="interstitial">
  <main>
    <h1>Your connection isn’t private</h1>
    <p class="note">Someone may be trying to pretend to be <strong id="host"></strong> to steal your information, such as passwords, messages or card numbers.</p>
    <p class="note" id="reason"></p>
    <p class="note mono" id="code"></p>
    <div class="actions">
      <button class="primary" id="back" type="button">Back to safety</button>
      <a id="advanced" href="#">Advanced</a>
    </div>
    <div id="details" hidden>
      <p class="note">Lumen can’t confirm the certificate this site sent. It may be misconfigured, or someone may be intercepting your connection.</p>
      <p class="note"><a id="continue" href="#">Continue to <span id="host2"></span> (unsafe)</a></p>
    </div>
  </main>
  <script src="cert-error.js"></script>
</body>
</html>
