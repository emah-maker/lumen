<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:; frame-src 'none'; form-action 'none'; base-uri 'none'" />
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <aside class="nav">
    <h1>Settings</h1>
    <nav id="nav" aria-label="Settings sections"></nav>
  </aside>
  <main>
    <div class="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.4 10.4 3.1 3.1"/></svg>
      <input id="search" type="search" placeholder="Search settings" aria-label="Search settings" aria-keyshortcuts="Control+F /" autocomplete="off" spellcheck="false" />
    </div>
    <div id="sections"></div>
    <p id="no-results" class="empty" hidden>No settings match your search.</p>
    <p id="unavailable" class="empty" hidden>Settings can only be changed from Lumen's own settings tab. Open ⋯ → Settings.</p>
  </main>
  <script src="picker.js"></script>
  <script src="settings-updates.js"></script>
  <script src="settings.js"></script>
</body>
</html>
