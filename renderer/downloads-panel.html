<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:" />
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff; --border: rgba(0, 0, 0, 0.1); --text: #1d1d1f; --muted: #6e6e73; --faint: rgba(0, 0, 0, 0.06);
      --hover: rgba(0, 0, 0, 0.045); --selected: rgba(0, 122, 255, 0.12); --accent: #007aff; --danger: #d70015; --shadow: rgba(0, 0, 0, 0.2);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #2c2c2e; --border: rgba(255, 255, 255, 0.12); --text: #f5f5f7; --muted: #98989d; --faint: rgba(255, 255, 255, 0.08);
        --hover: rgba(255, 255, 255, 0.06); --selected: rgba(10, 132, 255, 0.24); --accent: #0a84ff; --danger: #ff6961; --shadow: rgba(0, 0, 0, 0.55);
      }
    }
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font: 13px/1.4 -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
    /* Room for the shadow inside this view, as in suggest.html. */
    #card {
      margin: 6px 16px 24px; border-radius: 14px; background: var(--surface); transform-origin: top right; overflow: hidden;
      /* main.js caps the view at the window's bottom: the card fits it and the list is what gives
         way (it scrolls), so the header and "Show all downloads" stay reachable on a short window. */
      display: flex; flex-direction: column; max-height: calc(100vh - 30px);
      box-shadow: 0 0 0 0.5px var(--border), 0 16px 36px -10px var(--shadow);
    }
    #card.entering { animation: drop 320ms cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 6px 16px; }
    h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    #list { list-style: none; margin: 0; padding: 0 6px; max-height: 452px; overflow-y: auto; flex: 0 1 auto; min-height: 0; }
    header, footer, #empty, .hint { flex: none; }
    li { position: relative; display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: default; transition: background-color 120ms ease-out; }
    li:hover { background: var(--hover); }
    li.selected { background: var(--selected); }
    li.openable { cursor: pointer; }
    li.fresh { animation: row 360ms cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    @keyframes row { from { opacity: 0; transform: translateY(-4px); } }
    .icon { width: 32px; height: 32px; display: grid; place-items: center; }
    .icon img { width: 32px; height: 32px; -webkit-user-drag: none; }
    .icon svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .text { min-width: 0; }
    .name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 500; }
    li.missing .name { color: var(--muted); text-decoration: line-through; }
    .status { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 1px; }
    li.failed .status { color: var(--danger); }
    .bar { height: 3px; border-radius: 2px; background: var(--faint); margin-top: 6px; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width 240ms ease-out; }
    li.paused .bar i { background: var(--muted); }
    .bar.unknown i { width: 30%; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    .actions { display: flex; gap: 2px; opacity: 0; transition: opacity 120ms ease-out; }
    li:hover .actions, li.selected .actions, li.progressing .actions, li:focus-within .actions { opacity: 1; }
    button { font: inherit; color: inherit; background: none; border: 0; margin: 0; }
    .act { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); transition: background-color 120ms ease-out, color 120ms ease-out; }
    .act:hover { background: var(--faint); color: var(--text); }
    .act:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .act svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #empty { padding: 22px 16px 26px; text-align: center; color: var(--muted); }
    #empty b { display: block; color: var(--text); font-weight: 500; margin-bottom: 2px; }
    footer { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px 10px; border-top: 0.5px solid var(--faint); margin-top: 6px; }
    .link { padding: 6px 8px; border-radius: 7px; color: var(--accent); transition: background-color 120ms ease-out; }
    .link:hover { background: var(--faint); }
    .link[hidden] { display: none; }
    .hint { color: var(--muted); font-size: 11px; padding: 0 16px 8px; }
    @media (prefers-reduced-motion: reduce) {
      #card.entering, li.fresh { animation: fade 140ms ease-out; }
      .bar.unknown i { animation: none; width: 100%; opacity: 0.5; }
      @keyframes fade { from { opacity: 0; } }
    }
  </style>
</head>
<body>
  <div id="card" role="dialog" aria-label="Downloads">
    <header>
      <h1>Downloads</h1>
      <button class="act" id="folder" type="button" title="Open Downloads folder" aria-label="Open Downloads folder">
        <svg viewBox="0 0 16 16"><path d="M2 4.5c0-.8.7-1.5 1.5-1.5h2.6l1.4 1.5h5c.8 0 1.5.7 1.5 1.5v5.5c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5z"/></svg>
      </button>
    </header>
    <ul id="list" role="listbox" aria-label="Recent downloads"></ul>
    <div id="empty" hidden><b>No downloads yet</b>Files you download appear here.</div>
    <div class="hint" id="hint" hidden>Drag a file into any app to use it there.</div>
    <footer>
      <button class="link" id="clear" type="button">Clear list</button>
      <button class="link" id="show-all" type="button">Show all downloads</button>
    </footer>
  </div>
  <script src="downloads-panel.js"></script>
</body>
</html>
