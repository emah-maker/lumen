# Pull requests and main: lint and acceptance tests on Linux; every pure-node unit suite (scripts/test/test-units.js, 3 at a time)
# on Linux, Windows and macOS, so platform-only breaks show on the PR. The Electron suites (npm test) need a display and stay
# local; release.yml runs the same unit script before building.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No postinstall: it downloads the Electron binary, which none of these steps need.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Pure node (no Electron, about a minute): prompt and tool budgets, docs and contracts the unit suites do not cover.
      - name: Acceptance tests
        run: node scripts/test/test-acceptance.js

  units:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No postinstall: it downloads the Electron binary, which none of these steps need.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        shell: bash
        run: node scripts/test/test-units.js --jobs 3
