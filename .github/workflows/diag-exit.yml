# TEMPORARY diagnostic (delete before merge): which way of reading the Electron binary leaves a Windows process that will not exit.
name: diag-exit
on:
  pull_request:
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch the Electron binary
        run: node node_modules/electron/install.js
      - name: Loop variants
        shell: bash
        run: node scripts/diag/loop.js
