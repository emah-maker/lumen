# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job below can write (create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Offline tests only (no API keys, no live sites): a release never ships with these failing.
      - name: Test
        shell: bash
        run: node test/models.js && node test/adhd.js && node test/pagecontext.js && node test/providers.js && node test/import.js

      - name: Build
        shell: bash
        run: node scripts/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List build output
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

  # Tags only: attaches every platform's build to one GitHub Release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
