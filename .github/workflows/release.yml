# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers. Installed copies of Lumen
#   find it through latest.yml / latest-mac.yml (src/features/updates.js). The tag must match
#   package.json's version: electron-builder names the files and writes the update info from it.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job below can write (create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    # actions: read lets the SignPath action read this run's job details and artifacts (Windows signing).
    permissions:
      contents: read
      actions: read
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      # No certificate is picked up from the keychain on its own; a Developer ID build opts in through
      # CSC_LINK (scripts/build.js turns discovery back on for it).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The update info inside the release says package.json's version: a v0.3.0 tag on a 0.2.4
      # package.json would publish files that installed copies never see as newer.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Offline tests only (no API keys, no live sites): a release never ships with these failing.
      - name: Test
        shell: bash
        run: node test/models.js && node test/adhd.js && node test/pagecontext.js && node test/providers.js && node test/import.js

      # Pure-logic suites (no window, no network): a broken updater or installer setting can't ship.
      - name: Unit tests
        shell: bash
        run: |
          set -e
          for t in units updates-units agentic-units catalog-units clock-style-units github-units gmail-units highlight-units local-custom-units markets-units math-units model-route-units password-units settings-async-units setup-units signing-units signed-in-units slack-units small-screen-units spotify-units tradingview-units whats-new-units widget-edit-units widget-summary-units widget-units; do
            echo "::group::$t"
            node "test/$t.js"
            echo "::endgroup::"
          done

      # Widevine VMP signing (scripts/after-pack.js) needs a free castlabs EVS account. Add the
      # repository secrets EVS_ACCOUNT_NAME and EVS_PASSWD to enable it; without them the build is
      # unsigned and production DRM (Netflix, Disney+, ...) may not play.
      - name: Set up Widevine VMP signing
        id: vmp
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::warning::EVS_ACCOUNT_NAME / EVS_PASSWD secrets not set; building without Widevine VMP signing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            python -m pip install --upgrade castlabs-evs
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # macOS signing is opt-in by secret (docs/mac-signing.md). With a Developer ID certificate the
      # app is signed with the hardened runtime, notarized and stapled; without one the build is
      # ad-hoc / self-signed exactly as before. scripts/signing.js only tests that values are present;
      # nothing is printed. The API key secret is the .p8 file's text: notarytool wants a path, so it
      # is written to a private temp file (removed in the last step) and only the path is exported.
      - name: Detect macOS signing
        id: sign
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LUMEN_SIGN_P12: ${{ secrets.LUMEN_SIGN_P12 }}
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
        run: |
          set -e
          node scripts/signing.js --github-output >> "$GITHUB_OUTPUT"
          node scripts/signing.js
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            umask 077
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_KEY" > "$key"
            echo "api_key_path=$key" >> "$GITHUB_OUTPUT"
          fi

      # Developer ID certificate -> a keychain of our own. electron-builder's own CSC_LINK import runs
      # `security set-key-partition-list` with the wrong password on current macOS runners and fails, so the
      # .p12 is imported here (nothing is printed) and scripts/signing.js hands electron-builder the keychain
      # instead (LUMEN_KEYCHAIN). The keychain is deleted in the last step.
      - name: Import Developer ID certificate
        id: keychain
        if: matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -e
          umask 077
          kc_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_pw"
          kc="$RUNNER_TEMP/lumen-build.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "path=$kc" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning "$kc" | grep -E 'Developer ID Application|valid identit'

      # Windows signing is opt-in by secret too (docs/windows-signing.md): SIGNPATH_API_TOKEN and
      # SIGNPATH_ORGANIZATION_ID (secrets) and SIGNPATH_PROJECT_SLUG (repository variable). Without them
      # the Windows build is the unsigned build it has always been (the "Build" step below, unchanged).
      # scripts/signing.js only tests that values are present; nothing is printed.
      - name: Detect Windows signing
        id: winsign
        if: matrix.platform == 'win'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_CONFIG_SLUG: ${{ vars.SIGNPATH_APP_CONFIG_SLUG }}
          SIGNPATH_INSTALLER_CONFIG_SLUG: ${{ vars.SIGNPATH_INSTALLER_CONFIG_SLUG }}
          SIGNPATH_SIGN_APP: ${{ vars.SIGNPATH_SIGN_APP }}
        run: |
          set -e
          node scripts/signing.js --win --github-output >> "$GITHUB_OUTPUT"
          node scripts/signing.js --win

      - name: Build
        if: steps.winsign.outputs.enabled != 'true'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          # macOS: a stable self-signed identity keeps the Keychain's "Always Allow" across updates (scripts/after-sign.js).
          LUMEN_SIGN_P12: ${{ secrets.LUMEN_SIGN_P12 }}
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
          LUMEN_KEYCHAIN: ${{ matrix.platform == 'mac' && steps.keychain.outputs.path || '' }}
          # macOS Developer ID (mac job only; scripts/signing.js picks the mode from these). electron-builder
          # imports the CSC_LINK .p12 into its own temporary keychain, signs, notarizes and staples.
          CSC_LINK: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          # Notarization: the App Store Connect API key (preferred) or the Apple ID route.
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && steps.sign.outputs.api_key_path || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Gmail widget's one-click "Sign in with Google": Lumen's own Google Desktop OAuth client
          # (src/features/google-client.js). Optional; without these secrets the build keeps the
          # paste-your-own-client flow. An installed app's client secret is not confidential (RFC 8252).
          LUMEN_GOOGLE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_CLIENT_ID }}
          LUMEN_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMEN_GOOGLE_CLIENT_SECRET }}
          LUMEN_GOOGLE_VERIFIED: ${{ vars.LUMEN_GOOGLE_VERIFIED }} # '1' once Google has approved the built-in client's Gmail access
        run: node scripts/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List the zip in latest.yml
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled != 'true'
        shell: bash
        run: node scripts/add-zip-to-latest.js

      # ---- Windows, signed through SignPath (only when "Detect Windows signing" said enabled) ----------
      # Order matters (docs/windows-signing.md):
      #   1. electron-builder packs win-unpacked only (target dir). Lumen.exe gets its icon and version info
      #      (SignPath Foundation requires file metadata restrictions); VMP signing is deferred.
      #   2. SignPath Authenticode-signs Lumen.exe (request 1), which is copied back into win-unpacked.
      #   3. castlabs VMP signing, AFTER Authenticode (castlabs: on Windows VMP signs the exe's final bytes).
      #   4. electron-builder builds the NSIS installer and the zip from that directory (--prepackaged), so the
      #      installed app and the update zip carry the signed, VMP-signed Lumen.exe.
      #   5. SignPath signs the Setup exe (request 2). Only the files SignPath signs are uploaded to it.
      #   6. latest.yml and the Setup exe's blockmap are recomputed from the signed file, then the zip is listed.
      # SIGNPATH_SIGN_APP=false skips 2 and 3 (the stock Electron exe stays, VMP-signed by the pack hook).
      - name: Build the app directory (SignPath)
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: bash
        env:
          SIGN_APP: ${{ steps.winsign.outputs.sign_app }}
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          LUMEN_GOOGLE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_CLIENT_ID }}
          LUMEN_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMEN_GOOGLE_CLIENT_SECRET }}
          LUMEN_GOOGLE_VERIFIED: ${{ vars.LUMEN_GOOGLE_VERIFIED }}
        run: |
          set -e
          if [ "$SIGN_APP" = "true" ]; then flag="--signpath-app"; else flag=""; fi
          node scripts/build.js --win dir $flag

      - name: Stage Lumen.exe for SignPath
        id: stage-app
        if: matrix.platform == 'win' && steps.winsign.outputs.sign_app == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/to-sign-app | Out-Null
          Copy-Item dist/win-unpacked/Lumen.exe dist/to-sign-app/Lumen.exe
          # SignPath's metadata restriction compares against the version info electron-builder wrote.
          $v = (Get-Item dist/to-sign-app/Lumen.exe).VersionInfo
          if ($v.ProductName -ne 'Lumen') { throw "Lumen.exe has ProductName '$($v.ProductName)', expected 'Lumen'" }
          "product_version=$($v.ProductVersion)" >> $env:GITHUB_OUTPUT

      - name: Upload Lumen.exe to be signed
        id: upload-app
        if: matrix.platform == 'win' && steps.winsign.outputs.sign_app == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-win-unsigned-app
          path: dist/to-sign-app
          retention-days: 1
          if-no-files-found: error

      - name: Sign Lumen.exe (SignPath)
        if: matrix.platform == 'win' && steps.winsign.outputs.sign_app == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ steps.winsign.outputs.project }}
          signing-policy-slug: ${{ steps.winsign.outputs.policy }}
          artifact-configuration-slug: ${{ steps.winsign.outputs.app_config }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            productVersion: "${{ steps.stage-app.outputs.product_version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600 # a release policy waits for a manual approval
          output-artifact-directory: dist/signed-app

      - name: Put the signed Lumen.exe back and VMP-sign it
        if: matrix.platform == 'win' && steps.winsign.outputs.sign_app == 'true'
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          VMP: ${{ steps.vmp.outputs.enabled }}
        run: |
          set -e
          test -f dist/signed-app/Lumen.exe || { echo "::error::SignPath returned no Lumen.exe"; exit 1; }
          cp dist/signed-app/Lumen.exe dist/win-unpacked/Lumen.exe
          if [ "$VMP" = "true" ]; then
            node scripts/vmp-sign.js --require dist/win-unpacked
          else
            echo "::warning::Widevine VMP signing skipped (no EVS secrets)"
          fi

      - name: Build the installer and zip from the signed directory
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: bash
        run: node scripts/build.js --win nsis zip --prepackaged dist/win-unpacked

      - name: Stage the Setup exe for SignPath
        id: stage-installer
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/to-sign-installer | Out-Null
          $setup = Get-ChildItem dist -Filter 'Lumen-Setup-*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no Lumen-Setup-*.exe in dist' }
          Copy-Item $setup.FullName dist/to-sign-installer/
          $v = (Get-Item $setup.FullName).VersionInfo
          if ($v.ProductName -ne 'Lumen') { throw "$($setup.Name) has ProductName '$($v.ProductName)', expected 'Lumen'" }
          "product_version=$($v.ProductVersion)" >> $env:GITHUB_OUTPUT

      - name: Upload the Setup exe to be signed
        id: upload-installer
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-win-unsigned-installer
          path: dist/to-sign-installer
          retention-days: 1
          if-no-files-found: error

      - name: Sign the Setup exe (SignPath)
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ steps.winsign.outputs.project }}
          signing-policy-slug: ${{ steps.winsign.outputs.policy }}
          artifact-configuration-slug: ${{ steps.winsign.outputs.installer_config }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            productVersion: "${{ steps.stage-installer.outputs.product_version }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed-installer

      # The signed Setup exe replaces the unsigned one; latest.yml (sha512, size) and the .blockmap were
      # written for the unsigned file, so they are recomputed before the zip is listed.
      - name: Publish the signed Setup exe and refresh the update info
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: bash
        run: |
          set -e
          for f in dist/signed-installer/Lumen-Setup-*.exe; do
            [ -f "$f" ] || { echo "::error::SignPath returned no Setup exe"; exit 1; }
            cp "$f" "dist/$(basename "$f")"
          done
          node scripts/refresh-latest.js dist
          node scripts/add-zip-to-latest.js
          node scripts/refresh-latest.js --check dist

      # Fails the release if what will be published is not what was signed: the Authenticode signature on
      # the Setup exe, on Lumen.exe in win-unpacked and in the release zip (the file installed copies swap
      # in), the VMP .sig next to it, and latest.yml's hashes. Signer details printed here are public.
      # test-signing certificates are not trusted by Windows (status UnknownError, signer present); only a
      # release policy must verify as Valid, with signtool as well.
      - name: Verify the Windows signatures
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        env:
          TRUSTED: ${{ steps.winsign.outputs.trusted }}
          SIGN_APP: ${{ steps.winsign.outputs.sign_app }}
          VMP: ${{ steps.vmp.outputs.enabled }}
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          function Test-Signed($file) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file : $($sig.Status) ; $($sig.SignerCertificate.Subject) ; issuer $($sig.SignerCertificate.Issuer)"
            if (-not $sig.SignerCertificate) { throw "$file is not signed" }
            if ($env:TRUSTED -eq 'true') {
              if ($sig.Status -ne 'Valid') { throw "$file : signature status $($sig.Status): $($sig.StatusMessage)" }
              if ($signtool) { & $signtool.FullName verify /pa /v $file; if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $file" } }
              else { Write-Host '::warning::signtool.exe not found; Get-AuthenticodeSignature only' }
            } elseif ($sig.Status -notin 'Valid', 'UnknownError') { throw "$file : signature status $($sig.Status): $($sig.StatusMessage)" }
          }
          $setup = Get-ChildItem dist -Filter 'Lumen-Setup-*.exe' | Select-Object -First 1
          Test-Signed $setup.FullName
          if ($env:SIGN_APP -eq 'true') {
            Test-Signed (Resolve-Path dist/win-unpacked/Lumen.exe).Path
            $tmp = Join-Path $env:RUNNER_TEMP 'zipcheck'
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive (Get-ChildItem dist -Filter '*-win-x64.zip' | Select-Object -First 1).FullName $tmp
            Test-Signed (Join-Path $tmp 'Lumen.exe')
            if ((Get-FileHash $tmp/Lumen.exe).Hash -ne (Get-FileHash dist/win-unpacked/Lumen.exe).Hash) { throw 'Lumen.exe in the zip is not the signed Lumen.exe' }
            if ($env:VMP -eq 'true' -and -not (Test-Path (Join-Path $tmp 'Lumen.exe.sig'))) { throw 'the zip has no Lumen.exe.sig (VMP)' }
          }

      - name: List build output
        shell: bash
        run: ls -la dist

      # Developer ID builds only: fail the release if the app Gatekeeper will see is not properly
      # signed (and, with notarization credentials, notarized and stapled). Checks the unpacked .app
      # and again the app inside each release zip, because that zip is what installed copies
      # download and swap in. Signing details printed here are public (authority, team id, flags).
      - name: Verify Developer ID signature and notarization
        if: matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true'
        shell: bash
        env:
          NOTARIZED: ${{ steps.sign.outputs.notarize != 'none' }}
        run: |
          set -eo pipefail
          verify() {
            app="$1"
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            info="$(codesign -dv --verbose=4 "$app" 2>&1)"
            echo "$info" | grep -E '^(Authority|TeamIdentifier|Identifier|Timestamp)|flags=' || true
            case "$info" in *flags=*runtime*) ;; *) echo "::error::$app is missing the hardened runtime"; exit 1 ;; esac
            if [ "$NOTARIZED" = "true" ]; then
              xcrun stapler validate "$app"
              spctl -a -vvv -t exec "$app"
            else
              echo "::warning::not notarized (no APPLE_API_KEY* or APPLE_ID* secrets): Gatekeeper will still block the first launch"
            fi
            echo "::endgroup::"
          }
          found=0
          for app in dist/mac*/*.app; do [ -d "$app" ] || continue; found=1; verify "$app"; done
          [ "$found" = 1 ] || { echo "::error::no .app found under dist/"; exit 1; }
          for zip in dist/*-mac-*.zip; do
            [ -f "$zip" ] || continue
            tmp="$(mktemp -d)"
            ditto -x -k "$zip" "$tmp"
            for app in "$tmp"/*.app; do verify "$app"; done
            rm -rf "$tmp"
          done

      - name: Remove the notarization key and build keychain
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/developer-id.p12
          security delete-keychain "$RUNNER_TEMP/lumen-build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          # latest*.yml and the blockmaps are what installed copies read to find and verify updates.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  # Tags only: attaches every platform's build to one GitHub Release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
