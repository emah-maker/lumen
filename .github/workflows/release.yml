# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Build
        shell: bash
        run: node scripts/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List build output
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
