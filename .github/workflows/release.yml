# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers. Installed copies of Lumen
#   find it through latest.yml / latest-mac.yml (features/updates.js). The tag must match
#   package.json's version: electron-builder names the files and writes the update info from it.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job below can write (create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # The update info inside the release says package.json's version: a v0.3.0 tag on a 0.2.4
      # package.json would publish files that installed copies never see as newer.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Offline tests only (no API keys, no live sites): a release never ships with these failing.
      - name: Test
        shell: bash
        run: node test/models.js && node test/adhd.js && node test/pagecontext.js && node test/providers.js && node test/import.js

      - name: Build
        shell: bash
        run: node scripts/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List build output
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          # latest*.yml and the blockmaps are what installed copies read to find and verify updates.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  # Tags only: attaches every platform's build to one GitHub Release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest.yml
            dist/latest-mac.yml
            dist/*.blockmap
