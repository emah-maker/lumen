# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers. Installed copies of Lumen
#   find it through latest.yml / latest-mac.yml (features/updates.js). The tag must match
#   package.json's version: electron-builder names the files and writes the update info from it.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job below can write (create the release).
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The update info inside the release says package.json's version: a v0.3.0 tag on a 0.2.4
      # package.json would publish files that installed copies never see as newer.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Offline tests only (no API keys, no live sites): a release never ships with these failing.
      - name: Test
        shell: bash
        run: node test/models.js && node test/adhd.js && node test/pagecontext.js && node test/providers.js && node test/import.js

      # Widevine VMP signing (scripts/after-pack.js) needs a free castlabs EVS account. Add the
      # repository secrets EVS_ACCOUNT_NAME and EVS_PASSWD to enable it; without them the build is
      # unsigned and production DRM (Netflix, Disney+, ...) may not play.
      - name: Set up Widevine VMP signing
        id: vmp
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::warning::EVS_ACCOUNT_NAME / EVS_PASSWD secrets not set; building without Widevine VMP signing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            python -m pip install --upgrade castlabs-evs
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          # macOS: a stable self-signed identity keeps the Keychain's "Always Allow" across updates (scripts/after-sign.js).
          LUMEN_SIGN_P12: ${{ secrets.LUMEN_SIGN_P12 }}
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
          # Gmail widget's one-click "Sign in with Google": Lumen's own Google Desktop OAuth client
          # (features/google-client.js). Optional; without these secrets the build keeps the
          # paste-your-own-client flow. An installed app's client secret is not confidential (RFC 8252).
          LUMEN_GOOGLE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_CLIENT_ID }}
          LUMEN_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMEN_GOOGLE_CLIENT_SECRET }}
        run: node scripts/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List the zip in latest.yml
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/add-zip-to-latest.js

      - name: List build output
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          # latest*.yml and the blockmaps are what installed copies read to find and verify updates.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  # Tags only: attaches every platform's build to one GitHub Release.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest.yml
            dist/latest-mac.yml
            dist/*.blockmap
