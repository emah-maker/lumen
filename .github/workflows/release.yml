# Builds Lumen for Windows and macOS.
# - Push a tag like v0.2.0 to publish a GitHub Release with the installers. Installed copies of Lumen
#   find it through latest.yml / latest-mac.yml (src/features/updates.js). The tag must match
#   package.json's version: electron-builder names the files and writes the update info from it.
# - Run manually (Actions -> Release -> Run workflow) to get the builds as workflow artifacts only; nothing is published.
#   scripts/release/release.js does this on the release branch while the local checks run (the "preflight"): the unit suites and the
#   build both pass BEFORE the tag exists, so a failure there burns no version number. That run also records a manifest
#   (lumen-manifest: the commit's tree and every file's SHA-256).
# - On the tag, the plan job looks for such a preflight whose tree and version equal the tagged commit's (a squash merge has a
#   new SHA but the same tree when main did not move). Found: publish skips the unit suites and the build, and publishes
#   the preflight's artifacts after checking every checksum (scripts/release/release-reuse.js). Not found: units and build run here, in
#   parallel, exactly as a build always did.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default; only the publish job below can write (create the release), and only on a tag.
permissions:
  contents: read

jobs:
  # Tags: is there a preflight run of this exact tree to publish? (reuse_run = its id, or empty.) Dispatch runs have nothing to look for.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse_run: ${{ steps.find.outputs.reuse_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The update info inside the release says package.json's version: a v0.3.0 tag on a 0.2.4
      # package.json would publish files that installed copies never see as newer.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "::error::tag $TAG does not match package.json version $version"; exit 1; fi

      - name: Look for a preflight build of this tree
        id: find
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Any trouble finding one just means "build here": it never fails the run.
        run: node scripts/release/release-reuse.js find >> "$GITHUB_OUTPUT" || echo "reuse_run=" >> "$GITHUB_OUTPUT"

  # Every pure-node unit suite on the platform it ships for (CI runs them on Linux). Beside the build, not before it.
  units:
    needs: plan
    if: needs.plan.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # No postinstall: it downloads the Electron binary, which the unit suites do not need.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Pure-logic suites (no window, no network): a broken updater or installer setting can't ship. Several at a time.
      - name: Unit tests
        shell: bash
        run: node scripts/test/test-units.js --jobs 3

  build:
    needs: plan
    if: needs.plan.outputs.reuse_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            targets: nsis zip
          - os: macos-latest
            platform: mac
            targets: ''
    runs-on: ${{ matrix.os }}
    env:
      LUMEN_BUILD_DIR: ${{ github.workspace }}/dist
      # No certificate is picked up from the keychain on its own; a Developer ID build opts in through
      # CSC_LINK (scripts/build/build.js turns discovery back on for it).
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # The Electron zip (postinstall / install.js) and electron-builder's own downloads (nsis, winCodeSign, dmg tools), per OS.
      # Keyed on the lockfile, which pins the Electron version; a stale entry only ever saves a download or leaves one to redo.
      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Newer npm versions can skip Electron's download script; fetch the binary explicitly.
      - name: Download Electron
        run: node node_modules/electron/install.js

      # Offline tests only (no API keys, no live sites): a release never ships with these failing. (The unit suites run in the units job.)
      - name: Test
        shell: bash
        run: node test/e2e/models.js && node test/e2e/adhd.js && node test/e2e/pagecontext.js && node test/e2e/providers.js && node test/e2e/import.js

      # Widevine VMP signing (scripts/release/after-pack.js) needs a free castlabs EVS account. Add the
      # repository secrets EVS_ACCOUNT_NAME and EVS_PASSWD to enable it; without them the build is
      # unsigned and production DRM (Netflix, Disney+, ...) may not play.
      - name: Set up Widevine VMP signing
        id: vmp
        shell: bash
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
        run: |
          if [ -z "$EVS_ACCOUNT_NAME" ] || [ -z "$EVS_PASSWD" ]; then
            echo "::warning::EVS_ACCOUNT_NAME / EVS_PASSWD secrets not set; building without Widevine VMP signing"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            python -m pip install --upgrade castlabs-evs
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # macOS signing is opt-in by secret (docs/mac-signing.md). With a Developer ID certificate the
      # app is signed with the hardened runtime, notarized and stapled; without one the build is
      # ad-hoc / self-signed exactly as before. scripts/release/signing.js only tests that values are present;
      # nothing is printed. The API key secret is the .p8 file's text: notarytool wants a path, so it
      # is written to a private temp file (removed in the last step) and only the path is exported.
      - name: Detect macOS signing
        id: sign
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LUMEN_SIGN_P12: ${{ secrets.LUMEN_SIGN_P12 }}
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
        run: |
          set -e
          node scripts/release/signing.js --github-output >> "$GITHUB_OUTPUT"
          node scripts/release/signing.js
          if [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            umask 077
            key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            printf '%s\n' "$APPLE_API_KEY" > "$key"
            echo "api_key_path=$key" >> "$GITHUB_OUTPUT"
          fi

      # Developer ID certificate -> a keychain of our own. electron-builder's own CSC_LINK import runs
      # `security set-key-partition-list` with the wrong password on current macOS runners and fails, so the
      # .p12 is imported here (nothing is printed) and scripts/release/signing.js hands electron-builder the keychain
      # instead (LUMEN_KEYCHAIN). The keychain is deleted in the last step.
      - name: Import Developer ID certificate
        id: keychain
        if: matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -e
          umask 077
          kc_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$kc_pw"
          kc="$RUNNER_TEMP/lumen-build.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$p12" -k "$kc" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          echo "path=$kc" >> "$GITHUB_OUTPUT"
          security find-identity -v -p codesigning "$kc" | grep -E 'Developer ID Application|valid identit'

      # Windows signing is opt-in by secret (docs/windows-signing.md): Azure Artifact Signing through
      # electron-builder. It needs the three AZURE_* secrets and the four AZURE_SIGNING_* variables;
      # without them (or with only some, which is warned about) the build is unsigned as before.
      # scripts/release/signing.js only tests that values are present; nothing is printed.
      - name: Detect Windows signing
        id: winsign
        if: matrix.platform == 'win'
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          set -e
          node scripts/release/signing.js --win --github-output >> "$GITHUB_OUTPUT"
          node scripts/release/signing.js --win

      - name: Build
        shell: bash
        env:
          # Windows Azure Artifact Signing (windows job only, and only when every value is present).
          # electron-builder's TrustedSigning module reads the AZURE_TENANT_ID / CLIENT_ID / CLIENT_SECRET trio itself.
          AZURE_TENANT_ID: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && vars.AZURE_SIGNING_ENDPOINT || '' }}
          AZURE_SIGNING_ACCOUNT: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && vars.AZURE_SIGNING_ACCOUNT || '' }}
          AZURE_SIGNING_PROFILE: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && vars.AZURE_SIGNING_PROFILE || '' }}
          AZURE_SIGNING_PUBLISHER: ${{ matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true' && vars.AZURE_SIGNING_PUBLISHER || '' }}
          EVS_ACCOUNT_NAME: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_ACCOUNT_NAME || '' }}
          EVS_PASSWD: ${{ steps.vmp.outputs.enabled == 'true' && secrets.EVS_PASSWD || '' }}
          # macOS: a stable self-signed identity keeps the Keychain's "Always Allow" across updates (scripts/release/after-sign.js).
          LUMEN_SIGN_P12: ${{ secrets.LUMEN_SIGN_P12 }}
          LUMEN_SIGN_PASSWORD: ${{ secrets.LUMEN_SIGN_PASSWORD }}
          LUMEN_KEYCHAIN: ${{ matrix.platform == 'mac' && steps.keychain.outputs.path || '' }}
          # macOS Developer ID (mac job only; scripts/release/signing.js picks the mode from these). electron-builder
          # imports the CSC_LINK .p12 into its own temporary keychain, signs, notarizes and staples.
          CSC_LINK: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.CSC_KEY_PASSWORD || '' }}
          # Notarization: the App Store Connect API key (preferred) or the Apple ID route.
          APPLE_API_KEY: ${{ matrix.platform == 'mac' && steps.sign.outputs.api_key_path || '' }}
          APPLE_API_KEY_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true' && secrets.APPLE_TEAM_ID || '' }}
          # Gmail widget's one-click "Sign in with Google": Lumen's own Google Desktop OAuth client
          # (src/features/google-client.js). Optional; without these secrets the build keeps the
          # paste-your-own-client flow. An installed app's client secret is not confidential (RFC 8252).
          LUMEN_GOOGLE_CLIENT_ID: ${{ secrets.LUMEN_GOOGLE_CLIENT_ID }}
          LUMEN_GOOGLE_CLIENT_SECRET: ${{ secrets.LUMEN_GOOGLE_CLIENT_SECRET }}
          LUMEN_GOOGLE_VERIFIED: ${{ vars.LUMEN_GOOGLE_VERIFIED }} # '1' once Google has approved the built-in client's Gmail access
        run: node scripts/build/build.js --${{ matrix.platform }} ${{ matrix.targets }}

      - name: List the zip in latest.yml
        if: matrix.platform == 'win'
        shell: bash
        run: node scripts/release/add-zip-to-latest.js

      - name: List build output
        shell: bash
        run: ls -la dist

      # Developer ID builds only: fail the release if the app Gatekeeper will see is not properly
      # signed (and, with notarization credentials, notarized and stapled). Checks the unpacked .app
      # and again the app inside each release zip, because that zip is what installed copies
      # download and swap in. Signing details printed here are public (authority, team id, flags).
      - name: Verify Developer ID signature and notarization
        if: matrix.platform == 'mac' && steps.sign.outputs.developer_id == 'true'
        shell: bash
        env:
          NOTARIZED: ${{ steps.sign.outputs.notarize != 'none' }}
        run: |
          set -eo pipefail
          verify() {
            app="$1"
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            info="$(codesign -dv --verbose=4 "$app" 2>&1)"
            echo "$info" | grep -E '^(Authority|TeamIdentifier|Identifier|Timestamp)|flags=' || true
            case "$info" in *flags=*runtime*) ;; *) echo "::error::$app is missing the hardened runtime"; exit 1 ;; esac
            if [ "$NOTARIZED" = "true" ]; then
              xcrun stapler validate "$app"
              spctl -a -vvv -t exec "$app"
            else
              echo "::warning::not notarized (no APPLE_API_KEY* or APPLE_ID* secrets): Gatekeeper will still block the first launch"
            fi
            echo "::endgroup::"
          }
          found=0
          for app in dist/mac*/*.app; do [ -d "$app" ] || continue; found=1; verify "$app"; done
          [ "$found" = 1 ] || { echo "::error::no .app found under dist/"; exit 1; }
          for zip in dist/*-mac-*.zip; do
            [ -f "$zip" ] || continue
            tmp="$(mktemp -d)"
            ditto -x -k "$zip" "$tmp"
            for app in "$tmp"/*.app; do verify "$app"; done
            rm -rf "$tmp"
          done

      # Signed Windows builds only: fail the release if Lumen.exe (the folder, and the copy inside the
      # release zip that in-app updates swap in) or the Setup exe is not validly signed
      # and timestamped by the expected publisher. The zip's exe must also be the very file that was
      # signed. Skipped (nothing to verify) for the unsigned build. Signature details are public.
      - name: Verify Windows signature
        if: matrix.platform == 'win' && steps.winsign.outputs.enabled == 'true'
        shell: pwsh
        env:
          PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = $false
          function Test-Signed([string]$file) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '(none)' }
            Write-Host "$file : $($sig.Status) / $subject / timestamp: $([bool]$sig.TimeStamperCertificate)"
            $ok = $sig.Status -eq 'Valid' -and $sig.TimeStamperCertificate -and $subject.Contains($env:PUBLISHER)
            if (-not $ok) { Write-Host "::error::$file is not validly signed by '$env:PUBLISHER' with a timestamp"; $script:failed = $true }
          }
          $exe = 'dist/win-unpacked/Lumen.exe'
          Test-Signed $exe
          Get-ChildItem dist -Filter '*.exe' | ForEach-Object { Test-Signed $_.FullName }
          foreach ($zip in Get-ChildItem dist -Filter '*-win-*.zip') {
            $tmp = Join-Path $env:RUNNER_TEMP ('zipcheck-' + [guid]::NewGuid())
            Expand-Archive -Path $zip.FullName -DestinationPath $tmp
            $inner = Get-ChildItem $tmp -Recurse -Filter 'Lumen.exe' | Select-Object -First 1
            if (-not $inner) { Write-Host "::error::no Lumen.exe in $($zip.Name)"; $failed = $true; continue }
            Test-Signed $inner.FullName
            if ((Get-FileHash $inner.FullName).Hash -ne (Get-FileHash $exe).Hash) { Write-Host "::error::Lumen.exe in $($zip.Name) is not the signed one"; $failed = $true }
            Remove-Item $tmp -Recurse -Force
          }
          if ($failed) { exit 1 }

      - name: Remove the notarization key and build keychain
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/developer-id.p12
          security delete-keychain "$RUNNER_TEMP/lumen-build.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-${{ matrix.platform }}
          if-no-files-found: error
          # latest*.yml and the blockmaps are what installed copies read to find and verify updates.
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest*.yml
            dist/*.blockmap

  # Dispatch runs (the preflight): what was built, from which tree, with every file's SHA-256. Exists only when the units and both builds passed.
  manifest:
    needs: [units, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lumen-win
          path: built/win

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lumen-mac
          path: built/mac

      - name: Write the manifest
        run: node scripts/release/release-reuse.js manifest --win built/win --mac built/mac --out release-manifest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lumen-manifest
          if-no-files-found: error
          path: release-manifest.json

  # Tags only: attaches every platform's build to one GitHub Release: the preflight's (checked against its manifest) or the one built above.
  publish:
    needs: [plan, units, build]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.plan.result == 'success' &&
      (needs.plan.outputs.reuse_run != '' || (needs.units.result == 'success' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # A preflight of this exact tree: download its artifacts, check each against the manifest and the tree, flatten into dist/.
      - name: Fetch and verify the preflight build
        if: needs.plan.outputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.plan.outputs.reuse_run }}
        run: node scripts/release/release-reuse.js fetch --run "$RUN_ID" --dir dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.plan.outputs.reuse_run == ''
        with:
          path: dist
          merge-multiple: true

      # The release page's text: which file to download, the install guide, and this version's CHANGELOG section (scripts/release/release-notes.js).
      - name: Write the release notes
        run: node scripts/release/release-notes.js "$GITHUB_REF_NAME" --out release-notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/latest.yml
            dist/latest-mac.yml
            dist/*.blockmap
