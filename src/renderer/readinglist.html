<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:" />
  <title data-i18n="readingPage.title">Reading list</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="managers.css" />
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="readingPage.title">Reading list</h1>
      <div class="segmented" role="group" aria-label="Show" data-i18n-aria-label="readingPage.show">
        <button id="show-unread" type="button" aria-pressed="true" data-i18n="readingPage.unread">Unread</button>
        <button id="show-all" type="button" aria-pressed="false" data-i18n="readingPage.all">All</button>
      </div>
      <button id="mark-all" type="button" data-i18n="readingPage.markAll">Mark all read</button>
    </header>
    <input id="q" type="search" placeholder="Search the reading list" aria-label="Search the reading list" data-i18n-placeholder="readingPage.search" data-i18n-aria-label="readingPage.search" autocomplete="off" />
    <p id="status" role="status" aria-live="polite"></p>
    <div id="list"></div>
  </main>
  <script src="i18n.js"></script>
  <script src="managers-toast.js"></script>
  <script src="readinglist.js"></script>
</body>
</html>
