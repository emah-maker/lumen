<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- A deck's content is drawn from plain JSON with DOM calls (slides.js): no scripts but this page's own, no pictures but data: ones, nothing fetched. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:; font-src 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <title>Presentation</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    :root { --stage: #f2f2f4; --shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.08); }
    @media (prefers-color-scheme: dark) { :root { --stage: #111113; --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 4px 16px rgba(0, 0, 0, 0.4); } }
    html, body { margin: 0; background: var(--stage); color: var(--text); }
    body { font: 13px/1.5 -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--hairline); }
    #name { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
    #counter { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    button { font: inherit; color: var(--text); background: var(--field); border: 0; border-radius: 6px; padding: 4px 10px; cursor: default; transition: background var(--t-fast); }
    button:hover { background: var(--hover); }
    button:focus-visible { outline: none; box-shadow: var(--focus-ring); }
    button[disabled] { opacity: 0.4; }
    #notes { padding: 8px 16px; color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--hairline); }
    #notes:empty { display: none; }
    main { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 16px 64px; }
    .frame { width: min(1100px, 100%); }
    .slide { position: relative; overflow: hidden; background: #fff; box-shadow: var(--shadow); border-radius: 4px; outline: 2px solid transparent; outline-offset: 3px; transition: outline-color var(--t-base); }
    .frame.current .slide { outline-color: var(--accent); }
    .caption { display: flex; gap: 8px; justify-content: center; margin-top: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .caption .tag { padding: 0 6px; border-radius: 4px; background: var(--field); }
    .frame.hidden-slide .slide { opacity: 0.6; }
    .message { margin: 18vh auto 0; max-width: 520px; text-align: center; color: var(--muted); font-size: 14px; }
    .message strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

    /* One slide's drawing: 1 CSS px = 1 point, scaled to the frame by transform. Colors here are the deck's, not the theme's. */
    .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; color: #000; background: #fff; background-size: cover; background-position: center; }
    .shape, .pic, .tbl, .ph { position: absolute; box-sizing: border-box; }
    .shape .bg { position: absolute; inset: 0; box-sizing: border-box; }
    .text { position: absolute; inset: 0; display: flex; flex-direction: column; box-sizing: border-box; overflow: visible; font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; line-height: 1.2; overflow-wrap: break-word; }
    .text.nowrap { white-space: nowrap; }
    .text p, .tbl p { margin: 0; white-space: pre-wrap; }
    .text.nowrap p { white-space: pre; }
    .bullet { display: inline-block; }
    .pic { overflow: hidden; }
    .pic img { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }
    .missing, .ph { display: flex; align-items: center; justify-content: center; text-align: center; font: 12px/1.3 "Segoe UI", system-ui, sans-serif; color: #6e6e73; background: repeating-linear-gradient(135deg, rgba(0, 0, 0, 0.03) 0 8px, rgba(0, 0, 0, 0.06) 8px 16px); border: 1px dashed rgba(0, 0, 0, 0.25); }
    .tbl table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
    .tbl td { border: 1px solid #bfbfbf; padding: 3.6pt 7.2pt; vertical-align: top; overflow: hidden; font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; line-height: 1.2; overflow-wrap: break-word; }
    svg.line { position: absolute; overflow: visible; }

    /* Present (F5): one slide, full screen, on black. */
    html.presenting { overflow: hidden; }
    #present { position: fixed; inset: 0; z-index: 10; display: none; background: #000; cursor: none; }
    #present.on { display: block; }
    #present .slide { position: absolute; border-radius: 0; box-shadow: none; outline: 0; }
    #present .hint { position: absolute; right: 16px; bottom: 12px; color: rgba(255, 255, 255, 0.55); font-size: 12px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div id="name">Loading presentation…</div>
    <div id="counter" aria-live="polite"></div>
    <button id="prev" type="button" title="Previous slide (Page Up)" aria-label="Previous slide" disabled>‹</button>
    <button id="next" type="button" title="Next slide (Page Down)" aria-label="Next slide" disabled>›</button>
    <button id="presentBtn" type="button" title="Present full screen (F5)" disabled>Present</button>
  </header>
  <div id="notes"></div>
  <main id="slides"></main>
  <div id="present" role="dialog" aria-label="Presentation"><div class="hint" id="presentHint"></div></div>
  <script src="slides.js"></script>
</body>
</html>
