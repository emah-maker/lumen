<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title data-i18n="httpsOnly.title">Connection is not secure</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="interstitial">
  <main>
    <h1 data-i18n="httpsOnly.heading">This site doesn’t support a secure connection</h1>
    <p class="note" id="lead">Lumen tried <span class="mono" id="secure"></span> and couldn’t connect. Anything you send to <strong id="host"></strong> over an insecure connection can be read or changed by others on the network.</p>
    <p class="note" data-i18n="httpsOnly.setting">You turned on “Always use secure connections” in Settings → Privacy and security.</p>
    <div class="actions">
      <button class="primary" id="back" type="button" data-i18n="httpsOnly.back">Go back</button>
      <a id="continue" href="#" data-i18n="httpsOnly.continue">Continue to site (not secure)</a>
    </div>
  </main>
  <script src="i18n.js"></script>
  <script src="interstitial.js"></script>
  <script src="https-only.js"></script>
</body>
</html>
