<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <style>
    :root {
      color-scheme: light dark;
      --surface: #ffffff; --field: rgba(0, 0, 0, 0.05); --border: rgba(0, 0, 0, 0.1);
      --text: #1d1d1f; --muted: #6e6e73; --hover: rgba(0, 0, 0, 0.05);
      --accent: #007aff; --accent-deep: #0051d5; --accent-soft: rgba(0, 122, 255, 0.14); --on-accent: #ffffff;
      --danger: #d70015; --danger-deep: #b5000f; --warning: #b25000;
      --backdrop: rgba(0, 0, 0, 0.18); --shadow: rgba(0, 0, 0, 0.22);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #2c2c2e; --field: rgba(255, 255, 255, 0.08); --border: rgba(255, 255, 255, 0.12);
        --text: #f5f5f7; --muted: #98989d; --hover: rgba(255, 255, 255, 0.08);
        --accent: #0a84ff; --accent-deep: #0060df; --accent-soft: rgba(10, 132, 255, 0.2); --on-accent: #ffffff;
        --danger: #ff453a; --danger-deep: #d6261c; --warning: #ffb340;
        --backdrop: rgba(0, 0, 0, 0.4); --shadow: rgba(0, 0, 0, 0.6);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body {
      font: 13px/1.45 system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", sans-serif;
      letter-spacing: -0.003em; -webkit-font-smoothing: antialiased; color: var(--text); user-select: none;
    }
    #backdrop {
      position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start;
      padding-top: 14vh; background: var(--backdrop); opacity: 0; transition: opacity 200ms ease-out;
    }
    #backdrop.shown { opacity: 1; }
    #card {
      width: 420px; max-width: calc(100vw - 48px); border-radius: 14px; padding: 20px 20px 16px;
      background: var(--surface); color: var(--text);
      box-shadow: 0 0 0 0.5px var(--border), 0 24px 60px -12px var(--shadow), 0 4px 16px -6px var(--shadow);
      transform-origin: top center; opacity: 0; transform: scale(0.97);
      /* A page's alert() can be pages long. On a short window the card stops above the bottom edge
         and the message scrolls, so the buttons stay on screen (body clips; the view is the window). */
      display: flex; flex-direction: column; max-height: calc(86vh - 24px);
    }
    #card > * { flex: none; }
    /* (The 4px padding, taken back by the margin, keeps the fields' focus rings inside the scroller.) */
    #card > #head { flex: 0 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin: -4px; padding: 4px; }
    #card.entering { animation: card-in 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes card-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #card.entering { animation: fade-in 120ms ease-out forwards; }
      @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
      #backdrop { transition: none; }
    }
    #head { display: flex; align-items: flex-start; gap: 10px; }
    #icon { flex: none; width: 20px; height: 20px; margin-top: 1px; color: var(--warning); }
    #icon[hidden] { display: none; }
    #icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #text { min-width: 0; flex: 1; }
    #title { margin: 0 0 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    #title[hidden] { display: none; }
    #message { margin: 0; font-size: 16.5px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; }
    #detail { margin: 6px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    #detail[hidden] { display: none; }
    #fields { margin: 14px 0 0; display: flex; flex-direction: column; gap: 8px; }
    #fields[hidden] { display: none; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { color: var(--muted); font-size: 12px; }
    .field-label:empty { display: none; }
    .field input {
      height: 32px; padding: 0 10px; border: none; border-radius: 8px; background: var(--field);
      color: var(--text); font: inherit; letter-spacing: -0.003em; outline: none;
      box-shadow: 0 0 0 0 transparent; transition: background-color 140ms ease-out, box-shadow 140ms ease-out;
    }
    .field input:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--border), 0 0 0 3px var(--accent-soft); }
    #checkbox-row { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; color: var(--muted); font-size: 13px; cursor: default; }
    #checkbox-row[hidden] { display: none; }
    #checkbox-row input { accent-color: var(--accent); width: 14px; height: 14px; }
    /* Release notes (kind "notes", features/whats-new.js): a wider card, one section per version. */
    #card.wide { width: 560px; }
    #notes { margin: 12px 0 0; user-select: text; }
    #notes[hidden], #more[hidden], #notes-link[hidden] { display: none; }
    .release + .release { margin-top: 14px; padding-top: 12px; border-top: 0.5px solid var(--border); }
    .release h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
    .release h3 .date { margin-left: 6px; color: var(--muted); font-weight: 400; }
    .release ul { margin: 0; padding-left: 18px; }
    .release li, .release p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
    .release p { color: var(--muted); }
    .release code { font: 12px ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace; padding: 0 3px; border-radius: 4px; background: var(--field); }
    #more { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
    #notes-link { display: inline-block; margin: 10px 0 0; color: var(--accent); font-size: 13px; text-decoration: none; cursor: pointer; }
    #notes-link:hover { text-decoration: underline; }
    #notes-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    #card.wide #checkbox-row { margin-top: 12px; }
    #buttons { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .btn {
      height: 30px; padding: 0 14px; border: none; border-radius: 8px; background: var(--field); color: var(--text);
      font: inherit; font-weight: 500; letter-spacing: -0.003em; cursor: default;
      transition: background-color 120ms ease-out, transform 90ms ease-out, filter 120ms ease-out;
    }
    .btn:hover { background: var(--hover); }
    .btn:active { transform: scale(0.96); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn.primary:hover { background: var(--accent-deep); }
    .btn.danger { background: var(--danger); color: #ffffff; }
    .btn.danger:hover { background: var(--danger-deep); }
    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:active { transform: none; }
    }
  </style>
</head>
<body>
  <div id="backdrop">
    <div id="card" role="alertdialog" aria-modal="true" aria-labelledby="message">
      <div id="head">
        <div id="icon" hidden><svg viewBox="0 0 20 20"><path d="M10 2.5 2 17h16L10 2.5Z"/><path d="M10 8v4.2"/><circle cx="10" cy="14.6" r="0.75" fill="currentColor" stroke="none"/></svg></div>
        <div id="text">
          <p id="title" hidden></p>
          <p id="message"></p>
          <p id="detail" hidden></p>
          <div id="fields" hidden></div>
          <div id="notes" hidden></div>
          <p id="more" hidden></p>
          <a id="notes-link" hidden target="_blank" rel="noopener noreferrer"></a>
          <label id="checkbox-row" hidden><input type="checkbox" id="checkbox" /><span id="checkbox-label"></span></label>
        </div>
      </div>
      <div id="buttons"></div>
    </div>
  </div>
  <script src="dialog.js"></script>
</body>
</html>
