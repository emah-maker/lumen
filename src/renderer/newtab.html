<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data: file:; frame-src https:; form-action https:" />
  <title>New Tab</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --card: #f5f5f7; --field: rgba(0, 0, 0, 0.05); --hover: rgba(0, 0, 0, 0.06);
      --text: #1d1d1f; --muted: #6e6e73; --faint: #aeaeb2; --ring: rgba(0, 122, 255, 0.25);
      --border: rgba(0, 0, 0, 0.1); --accent: #007aff; --on-accent: #ffffff; --green: #248a3d; --shadow: rgba(0, 0, 0, 0.14);
      --mono-l: 92%; --mono-t: 32%;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      /* Spacing tokens, the 8pt scale; the widget grid (features/widget-layout.js) uses the same: 24 px gutter, 24 px page margin (32 from 1240 px), 48 px rows. */
      --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 32px; --gutter: 24px; --margin: 24px; --row: 48px;
    }
    @media (min-width: 1240px) { :root { --margin: 32px; } }
    :root { --rail-bg: color-mix(in srgb, var(--bg) 20%, transparent); --rail-bg-hot: color-mix(in srgb, var(--bg) 62%, transparent); --rail-dot: color-mix(in srgb, var(--text) 40%, transparent); --rail-dot-on: color-mix(in srgb, var(--text) 78%, transparent); }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e; --card: #2c2c2e; --field: rgba(255, 255, 255, 0.08); --hover: rgba(255, 255, 255, 0.08);
        --text: #f5f5f7; --muted: #98989d; --faint: #636366; --ring: rgba(10, 132, 255, 0.4);
        --border: rgba(255, 255, 255, 0.12); --accent: #0a84ff; --on-accent: #ffffff; --green: #30d158; --shadow: rgba(0, 0, 0, 0.55);
        --mono-l: 26%; --mono-t: 82%;
      }
    }
    html, body { margin: 0; min-height: 100%; }
    /* No native scrollbar and no reserved gutter, so the page and its background run to the right edge on every background
       (a native Windows scrollbar always takes layout width, and a reserved gutter is painted black). The page still scrolls
       with the wheel, keys and touch. newtab-scrollbar.js draws a thin overlay thumb on top of the page, fixed to the right
       edge (zero layout width, nothing shifts), that fades in only while the pointer is near that edge or the page scrolls. */
    html { scrollbar-width: none; }
    html::-webkit-scrollbar { display: none; }
    #sbar { position: fixed; top: 0; right: 0; bottom: 0; width: 14px; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.2s ease; }
    #sbar-thumb { position: absolute; right: 3px; width: 6px; border-radius: 3px; min-height: 28px; pointer-events: none;
      background: color-mix(in srgb, currentColor 50%, transparent); box-shadow: 0 0 0 0.5px color-mix(in srgb, var(--bg) 55%, transparent); transition: width 0.12s ease, background 0.12s ease; }
    html.show-scrollbar #sbar { opacity: 1; }
    html.show-scrollbar #sbar-thumb { pointer-events: auto; }
    html.show-scrollbar #sbar-thumb:hover, html.sb-drag #sbar-thumb { width: 8px; right: 2px; background: color-mix(in srgb, currentColor 70%, transparent); }
    html.sb-drag { user-select: none; }
    body {
      background: var(--bg); color: var(--text);
      font: 13px/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
    }
    ::selection { background: var(--ring); }
    /* The search box sits at the same height whatever the clock looks like: a bigger clock, another style or a card
       behind it takes room from the space above it (--main-pad, set by newtab-system.js), so the search box, the
       sections and every card stay where they are. (The top padding is fixed px, not a share of the window's height,
       so resizing the window doesn't move them either.) */
    main { --clock-size: 88px; --search-w: 640px; width: min(var(--search-w), 88vw); margin: 0 auto; padding: var(--main-pad, 88px) 0 48px; }

    /* [look] Backgrounds (Settings → Appearance → New tab page). On anything but Plain, text turns
       light and the cards become frosted glass over the picture or gradient. */
    #backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    #backdrop::before, #backdrop::after { content: ""; position: absolute; inset: -20%; }
    body[data-bg="plain"] #backdrop { display: none; }
    body[data-bg="aurora"] #backdrop { background: #06121f; }
    body[data-bg="aurora"] #backdrop::before { background: radial-gradient(40% 50% at 20% 30%, rgba(46, 213, 170, 0.55), transparent 70%), radial-gradient(45% 55% at 75% 25%, rgba(94, 92, 230, 0.55), transparent 70%), radial-gradient(50% 50% at 55% 85%, rgba(191, 90, 242, 0.4), transparent 70%); animation: drift 28s var(--ease) infinite alternate; }
    body[data-bg="dusk"] #backdrop { background: linear-gradient(160deg, #1d1b4b 0%, #5b2a86 45%, #d9577b 80%, #f7a26a 100%); }
    body[data-bg="ocean"] #backdrop { background: linear-gradient(160deg, #031b34 0%, #0a4a7a 45%, #0e8fa8 80%, #6fd6c8 100%); }
    body[data-bg="forest"] #backdrop { background: linear-gradient(160deg, #07170f 0%, #164430 45%, #2f7d4f 80%, #9fcf7a 100%); }
    body[data-bg="sunset"] #backdrop { background: linear-gradient(160deg, #2a0d2e 0%, #8a1f4b 40%, #f0584a 75%, #ffc26b 100%); }
    body[data-bg="graphite"] #backdrop { background: radial-gradient(120% 90% at 50% 0%, #3a3a3c 0%, #1c1c1e 60%, #111 100%); }
    body[data-bg="dusk"] #backdrop::before, body[data-bg="ocean"] #backdrop::before, body[data-bg="forest"] #backdrop::before, body[data-bg="sunset"] #backdrop::before {
      background: radial-gradient(35% 40% at 80% 20%, rgba(255, 255, 255, 0.16), transparent 70%), radial-gradient(40% 45% at 15% 80%, rgba(255, 255, 255, 0.08), transparent 70%);
      animation: drift 36s var(--ease) infinite alternate;
    }
    /* [look] An animated effect (newtab-effects.js) sits over the background, under everything else. */
    #effect {
      position: fixed; inset: 0; z-index: -1; width: 100vw; height: 100vh; pointer-events: none;
      /* It never takes a click. It fades behind the content column (newtab-effects.js draws that fade into
         the canvas: a CSS mask on a canvas that redraws every frame is repainted every frame and, with the
         blur behind the cards below, left vertical bands on some graphics cards). */
    }
    @media (max-width: 760px) { #effect { opacity: 0.35; } }
    /* Over an effect the search box, switch and cards are less see-through. */
    body.on-media.has-effect input:not(:focus) { background: rgba(28, 28, 32, 0.78); }
    body.on-media.has-effect .w-card, body.on-media.has-effect .privacy,
    body.on-media.has-effect .frequent a, body.on-media.has-effect .mode { background: rgba(28, 28, 32, 0.68); }
    /* No blur behind them while an effect animates: the blur re-samples the moving canvas every frame. */
    body.on-media.has-effect input, body.on-media.has-effect .frequent a, body.on-media.has-effect .privacy,
    body.on-media.has-effect .mode, body.on-media.has-effect .empty, body.on-media.has-effect .w-card {
      -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    /* [look] Widget cards: Frosted is see-through and blurred; Clear is as transparent as stays readable
       (a hairline edge, a faint veil, and a soft shadow under the text on a picture or gradient).
       Both win over a card's own colours and over the darker cards shown with an animated effect. */
    html body[data-wglass="frosted"] .w-card, html body[data-wglass="frosted"] .w-card.tinted {
      background: color-mix(in srgb, var(--card) 55%, transparent); -webkit-backdrop-filter: blur(18px) saturate(1.4); backdrop-filter: blur(18px) saturate(1.4);
    }
    html body.on-media[data-wglass="frosted"] .w-card, html body.on-media[data-wglass="frosted"] .w-card.tinted { background: rgba(255, 255, 255, 0.07); }
    html body.on-media.has-effect[data-wglass="frosted"] .w-card { background: rgba(28, 28, 32, 0.42); -webkit-backdrop-filter: none; backdrop-filter: none; }
    html body[data-wglass="clear"] .w-card, html body[data-wglass="clear"] .w-card.tinted, html body.on-media.has-effect[data-wglass="clear"] .w-card {
      background: color-mix(in srgb, var(--card) 14%, transparent); box-shadow: 0 0 0 0.5px var(--border); -webkit-backdrop-filter: none; backdrop-filter: none;
    }
    html body.on-media[data-wglass="clear"] .w-card, html body.on-media[data-wglass="clear"] .w-card.tinted { background: rgba(255, 255, 255, 0.025); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55), 0 0 14px rgba(0, 0, 0, 0.35); }
    body[data-bg="image"] #backdrop { background: #000 var(--wallpaper) center / cover no-repeat; }
    body[data-bg="image"] #backdrop::after { background: linear-gradient(180deg, rgba(0, 0, 0, 0.38) 0%, rgba(0, 0, 0, 0.12) 40%, rgba(0, 0, 0, 0.45) 100%); inset: 0; }
    @keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 2%, 0) scale(1.08); } }
    body.on-media {
      --text: #ffffff; --muted: rgba(255, 255, 255, 0.72); --faint: rgba(255, 255, 255, 0.5); --card: rgba(255, 255, 255, 0.12);
      --field: rgba(255, 255, 255, 0.16); --hover: rgba(255, 255, 255, 0.14); --border: rgba(255, 255, 255, 0.22); --bg: rgba(20, 20, 24, 0.55);
      --mono-l: 30%; --mono-t: 88%;
      background: #000; text-shadow: 0 1px 12px rgba(0, 0, 0, 0.25);
    }
    body.on-media input, body.on-media .frequent a, body.on-media .privacy, body.on-media .mode, body.on-media .empty, body.on-media .w-card {
      -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
    }
    body.on-media input { background: rgba(255, 255, 255, 0.16); color: #fff; box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.22); }
    body.on-media input:focus { background: rgba(20, 20, 24, 0.62); }
    body.on-media .frequent a, body.on-media .privacy, body.on-media .w-card { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.16); }
    /* The clock: large, light, and steady (tabular digits don't jitter as minutes change). Always full size: it never
       shrinks with the window and is never clipped or scrolled (the header is pinned in the centre column, never a card). */
    .clock { margin: 0 0 4px; font-size: var(--clock-size); white-space: nowrap; overflow: visible; line-height: 1; font-weight: 200; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .clock[hidden] { display: none; }
    main { animation: arrive 700ms var(--ease) both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) {
      main, #backdrop::before { animation: none !important; }
    }
    /* The slow drift moves a layer that every frosted card behind-blurs, so the GPU resamples all of them each frame.
       Aurora's layer is no longer filtered live: its radial gradients already fade to transparent on their own (a
       blur(30px) over them changed nothing visible and was re-run on every drift frame). The drift runs for the first
       seconds after the page shows (newtab-drift.js), then holds still, and holds while the page is hidden.
       Performance mode's "calm" stops it. */
    body.drift-paused #backdrop::before { animation-play-state: paused; }
    body.calm #backdrop::before { animation: none; }
    body.w-editing #backdrop::before { animation-play-state: paused; }

    header { margin-bottom: var(--space-3); }
    .date { margin: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
    h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.025em; }

    /* [look] Clock styles and greeting fonts (Settings → Home; features/clock-styles.js has the choices). Each style is
       a whole look: face, weight, size, tracking and where the date sits. System fonts only (the page loads none);
       Classic, no card and no extra shadow are exactly the page as it always was, so none of them has a rule here.
       The preview tiles in settings.css use the same stacks. */
    header {
      --f-display: -apple-system, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
      --f-rounded: ui-rounded, "SF Pro Rounded", "Segoe UI Variable Display", system-ui, sans-serif;
      --f-serif: ui-serif, "New York", "Iowan Old Style", Cambria, Georgia, serif; /* Cambria before Georgia: lining digits on Windows */
      --f-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
      --f-hand: "Segoe Print", "Bradley Hand", "Noteworthy", "Chalkboard SE", cursive;
    }
    .clock-card[hidden], .date[hidden] { display: none !important; }
    .clock-s { margin-left: 0.06em; font-size: 0.36em; font-weight: 400; letter-spacing: 0; color: var(--muted); }
    body[data-clock-style="rounded"] .clock { font-family: var(--f-rounded); font-size: calc(var(--clock-size) * 0.92); font-weight: 500; letter-spacing: -0.03em; }
    body[data-clock-style="rounded"] .date { font-family: var(--f-rounded); font-size: 13px; font-weight: 600; }
    /* Thin: big ultralight numerals with the date on top, as on a lock screen. */
    body[data-clock-style="thin"] .clock-card { display: flex; flex-direction: column-reverse; align-items: flex-start; }
    body[data-clock-style="thin"] .clock { margin: 0; font-family: var(--f-display); font-size: calc(var(--clock-size) * 1.3); line-height: 0.92; font-weight: 100; letter-spacing: -0.05em; }
    body[data-clock-style="thin"] .date { margin: 0 0 2px 0.06em; font-family: var(--f-display); font-size: 15px; font-weight: 550; letter-spacing: -0.01em; color: var(--text); opacity: 0.86; }
    body[data-clock-style="thin"] .clock-card:has(.clock[hidden]) .date { margin-bottom: 0; }
    body[data-clock-style="serif"] .clock { font-family: var(--f-serif); font-size: calc(var(--clock-size) * 0.95); font-weight: 400; letter-spacing: -0.025em; font-variant-numeric: tabular-nums lining-nums; font-optical-sizing: auto; }
    body[data-clock-style="serif"] .date { font-family: var(--f-serif); font-size: 15px; font-weight: 400; font-style: italic; letter-spacing: 0; }
    body[data-clock-style="mono"] .clock { font-family: var(--f-mono); font-size: calc(var(--clock-size) * 0.78); font-weight: 300; letter-spacing: -0.03em; }
    body[data-clock-style="mono"] .date { margin-top: 4px; font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    /* Stacked: heavy hours over minutes (the separator is still there for screen readers). */
    body[data-clock-style="bold"] .clock { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: end; margin-bottom: 8px; font-family: var(--f-display); font-size: calc(var(--clock-size) * 0.82); line-height: 0.86; font-weight: 800; letter-spacing: -0.045em; }
    body[data-clock-style="bold"] .clock[hidden] { display: none; }
    body[data-clock-style="bold"] .clock-h { grid-area: 1 / 1; }
    body[data-clock-style="bold"] .clock-m { grid-area: 2 / 1; }
    body[data-clock-style="bold"] .clock-s { grid-area: 2 / 2; margin: 0 0 0.3em 0.14em; font-weight: 600; }
    body[data-clock-style="bold"] .clock-sep { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    body[data-clock-style="bold"] .date { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    /* Behind the clock and date: nothing (default), a soft card, or glass. The text keeps its place in the column. */
    body[data-clock-card="soft"] .clock-card, body[data-clock-card="glass"] .clock-card { width: fit-content; max-width: calc(100% + 40px); margin: 0 -20px 12px; padding: 14px 20px 16px; border-radius: 24px; box-sizing: border-box; }
    body[data-clock-card="soft"] .clock-card { background: var(--card); box-shadow: 0 0 0 0.5px var(--border); }
    body[data-clock-card="glass"] .clock-card {
      background: color-mix(in srgb, var(--bg) 62%, transparent);
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.5), 0 0 0 0.5px var(--border), 0 12px 32px -14px var(--shadow);
      -webkit-backdrop-filter: blur(28px) saturate(1.8); backdrop-filter: blur(28px) saturate(1.8);
    }
    body.on-media[data-clock-card="soft"] .clock-card { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.16); -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5); }
    body.on-media[data-clock-card="glass"] .clock-card { background: rgba(255, 255, 255, 0.14); box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.35), 0 0 0 0.5px rgba(255, 255, 255, 0.2), 0 16px 40px -18px rgba(0, 0, 0, 0.5); }
    /* Over an animated effect: no blur (it would re-sample the moving canvas every frame), a denser card instead. */
    body.on-media.has-effect[data-clock-card] .clock-card { -webkit-backdrop-filter: none; backdrop-filter: none; }
    body.on-media.has-effect:is([data-clock-card="soft"], [data-clock-card="glass"]) .clock-card { background: rgba(28, 28, 32, 0.68); }
    /* A stronger shadow under the clock, date and greeting, over a background or picture only. */
    body.on-media[data-clock-shadow="1"] header { text-shadow: 0 1px 2px rgba(0, 0, 0, 0.24), 0 2px 24px rgba(0, 0, 0, 0.38); }
    /* The greeting's face. */
    body[data-greeting-font="rounded"] h1 { font-family: var(--f-rounded); letter-spacing: -0.02em; }
    body[data-greeting-font="serif"] h1 { font-family: var(--f-serif); font-size: 30px; font-weight: 500; letter-spacing: -0.015em; font-optical-sizing: auto; }
    body[data-greeting-font="thin"] h1 { font-family: var(--f-display); font-size: 32px; font-weight: 250; letter-spacing: -0.035em; }
    body[data-greeting-font="mono"] h1 { font-family: var(--f-mono); font-size: 24px; font-weight: 500; letter-spacing: -0.03em; }
    body[data-greeting-font="hand"] h1 { margin-top: 4px; font-family: var(--f-hand); font-size: 28px; line-height: 1.3; font-weight: 400; letter-spacing: 0; }

    form { position: relative; margin-bottom: var(--gutter); }
    form > svg { position: absolute; left: 15px; top: 23px; width: 16px; height: 16px; margin-top: -8px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; pointer-events: none; }
    input {
      width: 100%; box-sizing: border-box; height: 46px; padding: 0 44px 0 40px; border: none; border-radius: 12px;
      background: var(--card); color: var(--text); caret-color: var(--accent); font: inherit; font-size: 15px; letter-spacing: -0.01em; outline: none;
      box-shadow: 0 0 0 1px var(--border);
      transition: box-shadow 240ms var(--ease);
    }
    input::placeholder { color: var(--muted); }
    input:focus { background: var(--bg); box-shadow: 0 0 0 1px var(--accent), 0 0 0 4px var(--ring); }
    form > kbd {
      position: absolute; right: 12px; top: 23px; transform: translateY(-50%); min-width: 20px; padding: 1px 6px; border-radius: 6px;
      font: 600 11px/18px system-ui, sans-serif; color: var(--muted); text-align: center; box-shadow: inset 0 0 0 1px var(--border); transition: opacity 160ms ease-out;
    }
    input:focus ~ kbd, input:not(:placeholder-shown) ~ kbd { opacity: 0; }

    /* Search | Ask AI: a quiet two-option switch under the field. */
    .mode { display: inline-flex; gap: 2px; margin-top: 10px; padding: 2px; border-radius: 9px; background: var(--field); }
    .mode button {
      appearance: none; border: none; margin: 0; padding: 4px 12px; border-radius: 7px; background: transparent; color: var(--muted);
      font: 500 12px/18px system-ui, sans-serif; cursor: default; outline: none; transition: background-color 160ms ease-out, color 160ms ease-out;
    }
    .mode button:hover { color: var(--text); }
    .mode button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
    .mode button:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .mode-hint { margin-left: 8px; font-size: 11.5px; color: var(--muted); }

    section { margin-top: var(--gutter); }
    section:first-of-type { margin-top: 0; }
    h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0; }

    .grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 10px; }
    .grid a {
      display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 2px; min-width: 0;
      border-radius: 12px; color: var(--muted); text-decoration: none; outline: none; transition: color 150ms ease-out;
    }
    .grid a:hover, .grid a:focus-visible { color: var(--text); }
    .name { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 12px; }
    .tile {
      width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; background: var(--card);
      font-size: 20px; font-weight: 600; letter-spacing: -0.02em; box-shadow: 0 0 0 0.5px var(--border);
      transition: transform 360ms var(--ease), box-shadow 360ms var(--ease);
    }
    /* Monograms tinted per site (like Safari's), so sites that share a letter still look different. */
    .tile.mono { background: hsl(var(--hue) 70% var(--mono-l)); color: hsl(var(--hue) 55% var(--mono-t)); box-shadow: none; }
    .tile img { width: 28px; height: 28px; border-radius: 6px; }
    .grid a:hover .tile { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--border), 0 8px 18px -10px var(--shadow); }
    .grid a:active .tile { transform: scale(0.95); transition-duration: 90ms; }
    .grid a:focus-visible .tile { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

    .frequent { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .frequent a {
      display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 11px; border-radius: 12px;
      background: var(--card); color: var(--text); text-decoration: none; outline: none;
      transition: transform 280ms var(--ease), box-shadow 280ms var(--ease);
    }
    .frequent a:hover { background: var(--hover); }
    .frequent a:active { transform: scale(0.98); transition-duration: 90ms; }
    .frequent a:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .frequent .tile { width: 30px; height: 30px; border-radius: 8px; font-size: 13px; flex: none; box-shadow: none; background: transparent; }
    .frequent .tile.mono { background: hsl(var(--hue) 70% var(--mono-l)); }
    .frequent .tile img { width: 18px; height: 18px; border-radius: 4px; }
    .frequent .text { min-width: 0; display: flex; flex-direction: column; }

    .cd-big, .tm-clock { font-size: clamp(26px, 22cqh, 64px); font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .cd-unit { margin-top: 2px; color: var(--muted); font-size: 12.5px; }
    .cd-when { margin-top: 6px; color: var(--faint); font-size: 11px; }
    @container card (max-height: 150px) { .cd-when { display: none; } }
    .tm-phase { color: var(--muted); font-size: 12px; font-weight: 600; }
    .tm-bar { width: min(220px, 90%); height: 4px; margin: 8px 0 10px; border-radius: 2px; background: var(--field); overflow: hidden; }
    .tm-bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 900ms linear; }
    .tm-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
    .tm-btns .w-btn { margin: 0; }
    .w-card.tm-done .tm-phase { color: var(--accent); }
    @container card (max-height: 140px) { .tm-bar { display: none; } }
    /* AI status: a summary line and a dot per AI on a small card, a row per AI on a bigger one, then the model and usage hint
       and the live counts. The sizes are the content box's (features/aistatus-view.js THRESHOLDS; test/aistatus-units.js keeps the two the same).
       State is always words as well as a shape and colour: ready is a filled dot, limit reached a half-filled one, unreachable a dashed ring,
       signed out a ring, and off or not installed a dash. */
    .w-card.aistatus { --ai-ok: #17772f; --ai-warn: #a85d00; --ai-bad: #c4262e; }
    @media (prefers-color-scheme: dark) { .w-card.aistatus { --ai-ok: #4bd166; --ai-warn: #ffb454; --ai-bad: #ff7a72; } }
    body.on-media .w-card.aistatus { --ai-ok: #6ce085; --ai-warn: #ffc46b; --ai-bad: #ff9a94; }
    .w-card.aistatus .w-body { overflow: hidden; }
    .ai-mark { display: block; flex: none; box-sizing: border-box; width: 10px; height: 10px; border-radius: 50%; background: var(--faint); }
    .s-ready > .ai-mark { background: var(--ai-ok); }
    .s-limited > .ai-mark { border: 1.5px solid var(--ai-warn); background: linear-gradient(90deg, var(--ai-warn) 50%, transparent 50%); }
    .s-down > .ai-mark { border: 1.5px dashed var(--ai-bad); background: transparent; }
    .s-out > .ai-mark { border: 1.5px solid var(--muted); background: transparent; }
    .s-off > .ai-mark, .s-missing > .ai-mark { height: 2px; border-radius: 1px; background: var(--faint); }
    .ai-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .ai-compact { display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 0; flex: 1 1 auto; }
    .ai-sum > span { white-space: nowrap; }
    .ai-sum { margin: 0; font-size: 13px; font-weight: 650; line-height: 1.25; letter-spacing: -0.01em; }
    /* The small card's chips: the AI's logo, then its connector dot, then a word for the state and (when there is room) one fact. A CLI's logo sits in a square frame, an API provider's does not. */
    .ai-dots { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 9px; margin: 0; padding: 0; list-style: none; min-width: 0; }
    .ai-dot { position: relative; display: flex; align-items: center; gap: 3px; min-height: 14px; min-width: 0; }
    .ai-dot:not(.s-off):not(.s-missing) > .ai-mark { width: 8px; height: 8px; }
    .ai-dot.s-off > .ai-mark, .ai-dot.s-missing > .ai-mark { width: 8px; }
    .ai-logo { flex: none; box-sizing: border-box; width: 14px; height: 14px; color: var(--text); fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .ai-logo.filled { fill: currentColor; stroke: none; }
    .k-cli > .ai-logo { padding: 1px; border: 1px solid var(--faint); border-radius: 4px; }
    .s-off > .ai-logo, .s-missing > .ai-logo, .s-out > .ai-logo { opacity: 0.6; }
    .ai-lab { color: var(--muted); font-size: 10.5px; font-weight: 600; line-height: 14px; white-space: nowrap; }
    .ai-lab .ai-fact { font-weight: 500; }
    .s-limited > .ai-lab { color: var(--ai-warn); } .s-down > .ai-lab { color: var(--ai-bad); }
    .ai-nofact .ai-fact, .ai-nolabel .ai-lab { display: none; }
    .ai-more-chip { min-height: 14px; color: var(--muted); font-size: 10.5px; font-weight: 600; line-height: 14px; }
    .ai-sub { display: none; margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
    .ai-sub:empty { display: none !important; }
    @container card (min-height: 96px) { .ai-sub { display: block; } }
    .ai-list { display: none; flex-direction: column; gap: 8px; min-height: 0; flex: 1 1 auto; }
    @container card (min-width: 150px) and (min-height: 150px) { .ai-compact { display: none; } .ai-list { display: flex; } }
    @container card (min-width: 210px) and (min-height: 112px) { .ai-compact { display: none; } .ai-list { display: flex; } }
    .aistatus .w-body.ai-compact-only > .ai-compact { display: flex; }
    .aistatus .w-body.ai-compact-only > .ai-list { display: none; }
    .ai-rows { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
    .ai-row { display: grid; grid-template-columns: 10px minmax(0, 1fr); column-gap: 8px; row-gap: 1px; align-items: baseline; }
    .ai-row > .ai-mark { grid-row: 1 / span 2; align-self: start; margin-top: 3px; }
    .ai-name { min-width: 0; font-size: 12.5px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
    .ai-state { grid-column: 2; min-width: 0; color: var(--muted); font-size: 11.5px; line-height: 1.3; }
    .s-limited .ai-state { color: var(--ai-warn); }
    .s-down .ai-state { color: var(--ai-bad); }
    .ai-detail { display: none; grid-column: 2; min-width: 0; color: var(--muted); font-size: 11px; line-height: 1.3; }
    /* [usage bars] a thin bar for the plan's 5-hour window (amber from 80%, red and striped at the limit); the words beside it say the number too. */
    .ai-ubar { display: block; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--muted) 30%, transparent); overflow: hidden; }
    .ai-ubar > i { display: block; height: 100%; border-radius: 2px; background: var(--ai-ok); }
    .ai-ubar[data-level="warn"] > i { background: var(--ai-warn); }
    .ai-ubar[data-level="high"] > i { background: repeating-linear-gradient(135deg, var(--ai-bad) 0 4px, color-mix(in srgb, var(--ai-bad) 55%, transparent) 4px 7px); }
    .ai-ubar-dot { position: absolute; left: 0; right: 0; bottom: -4px; height: 2px; }
    .ai-ubar-row { grid-column: 2 / -1; margin-top: 3px; }
    .ai-nolabel .ai-ubar-dot { display: none; } /* (no room under the logo and dot of a tiny card) */
    .ai-more { margin: 0; color: var(--muted); font-size: 11px; }
    .ai-live { display: none; flex-wrap: wrap; gap: 2px 10px; margin: auto 0 0; padding-top: 7px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.3; }
    .ai-live > span { white-space: nowrap; }
    @container card (min-width: 210px) and (min-height: 112px) {
      .ai-row { grid-template-columns: 10px minmax(0, 1fr) auto; }
      .ai-row > .ai-mark { grid-row: 1; margin-top: 0; align-self: center; }
      .ai-state { grid-column: 3; text-align: right; }
      .ai-detail { grid-column: 2 / -1; grid-row: 2; }
    }
    @container card (min-width: 230px) and (min-height: 150px) { .ai-detail { display: block; } }
    @container card (min-width: 150px) and (min-height: 160px) { .ai-live { display: flex; } }
    /* Stocks and Crypto: a price table and a simulated paper portfolio. Direction is always shown with ▲/▼ as well as colour. */
    .w-card.stocks, .w-card.crypto { --up: #17772f; --down: #c4262e; }
    @media (prefers-color-scheme: dark) { .w-card.stocks, .w-card.crypto { --up: #4bd166; --down: #ff7a72; } }
    body.on-media .w-card.stocks, body.on-media .w-card.crypto { --up: #6ce085; --down: #ff9a94; }
    .w-card.stocks .w-body, .w-card.crypto .w-body { overflow: auto; }
    .mk-badge { flex: none; padding: 1px 7px; border-radius: 999px; background: var(--field); color: var(--muted); font-size: 10.5px; font-weight: 600; }
    .mk-badge.live { color: var(--up); } .mk-badge.off { color: var(--warn); }
    .mk-tabs { display: flex; gap: 2px; margin: 0 0 6px; }
    .mk-tab { appearance: none; border: 0; padding: 2px 9px; border-radius: 7px; background: transparent; color: var(--muted); font: 600 11px/18px system-ui, sans-serif; cursor: default; outline: none; }
    .mk-tab[aria-selected="true"] { background: var(--field); color: var(--text); }
    .mk-tab:focus-visible, .mk-trade select:focus-visible, .mk-trade input:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    .mk-panel[hidden] { display: none; }
    .mk-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
    .mk-table th, .mk-table td { padding: 3px 4px; text-align: right; font-weight: 400; white-space: nowrap; }
    .mk-table thead th { color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
    .mk-table th:first-child { text-align: left; }
    .mk-table tbody th.mk-sym { font-weight: 650; color: var(--text); }
    .mk-chg.up { color: var(--up); } .mk-chg.down { color: var(--down); } .mk-chg.flat { color: var(--muted); }
    .mk-foot { margin: 6px 0 0; color: var(--muted); font-size: 10.5px; }
    .mk-paper-note { margin: 0 0 6px; color: var(--muted); font-size: 10.5px; font-weight: 600; }
    .mk-sum { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 6px; }
    .mk-sum > div { display: flex; flex-direction: column; }
    .mk-k { color: var(--muted); font-size: 10.5px; } .mk-v { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .mk-hold { margin-bottom: 6px; }
    .mk-trade { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .mk-trade select, .mk-trade input { height: 28px; padding: 0 8px; border-radius: 8px; border: 0; background: var(--field); color: var(--text); font: 12.5px system-ui, sans-serif; outline: none; }
    .mk-trade input { width: 84px; min-width: 0; }
    .mk-trade .w-btn { margin: 0; }
    .mk-trade :disabled, .mk-trade .w-btn:disabled { opacity: 0.5; }
    .mk-err { min-height: 0; margin: 4px 0 0; color: var(--warn); font-size: 11.5px; } .mk-err:empty { display: none; }
    .mk-reset { margin-top: 8px; font-size: 11px; padding: 3px 10px; }
    .w-card.mk-offline .mk-table, .w-card.mk-offline .mk-sum { opacity: 0.55; }
    .mk-notice { margin: 0 0 6px; padding: 0; }

    /* A web page in a frame (no Lumen privileges: sandboxed, no referrer) fills its box, or a card that opens it. */
    .w-frame { display: block; flex: 1 1 0; min-height: 0; width: 100%; border: 0; border-radius: 10px; background: #fff; color-scheme: normal; }
    .w-card.embed { padding-bottom: 10px; }
    /* TradingView's frame sits in a box that clips it: a small card shrinks the frame to fit (transform) instead of clipping it (tradingview-fit.js). */
    .tv-fit { position: relative; flex: 1 1 0; min-height: 0; width: 100%; overflow: hidden; border-radius: 10px; }
    .tv-fit .w-frame { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
    .w-frame.tv-clear, .w-card.tv-watchlist .w-frame { background: transparent; } /* TradingView draws it see-through (isTransparent), so it sits on the card like a home-screen widget */
    .tv-note { margin: 0 0 6px; font-size: 11.5px; opacity: .75; }
    .tv-interval { flex: none; height: 20px; padding: 0 4px; border: 0; border-radius: 6px; background: rgb(255 255 255 / .12); color: inherit; font: inherit; font-size: 11px; cursor: pointer; }
    .tv-interval:hover { background: rgb(255 255 255 / .2); }
    .tv-interval option { color: #111; }
    .w-card.sp-web .w-body { overflow: hidden; }
    .sp-web-slot { flex: 1 1 0; min-height: 200px; width: 100%; border-radius: 10px; display: grid; place-items: center; align-content: center; gap: 10px; text-align: center; font-size: 12px; color: var(--muted); } /* Spotify's own page is drawn over this */
    .sp-web-down { padding: 12px; }
    .sp-web-msg { max-width: 28ch; }
    .sp-drm { margin: 0 0 6px; }
    .sp-web-signin { margin: 0 0 0 auto; padding: 3px 10px; font-size: 12px; }
    .w-fallback { display: flex; align-items: center; gap: 12px; padding: 4px 0 2px; }
    .w-fallback .tile { flex: none; width: 42px; height: 42px; border-radius: 11px; font-size: 17px; }
    .w-fallback .w-note { margin: 0; padding: 0; flex: 1 1 auto; min-width: 0; }
    .w-fallback .w-btn { margin: 0; flex: none; }
    @media (prefers-reduced-motion: reduce) {
      .w-skel i { animation: none; }
      .w-check, .w-row, .w-card, .w-ghost, main { transition: none; }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .frequent { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* [widget polish] One anatomy for every card, no native scrollbars, whole rows only. What fits is decided in
       newtab-widgets.js (settleCard); this is how it looks. Kept last so it wins over the per-widget rules above. */
    .fit-off { display: none !important; }
    .w-card { padding: 12px 16px 16px; }
    .w-card > .w-head { gap: 8px; min-height: 24px; margin-bottom: 8px; }
    .w-card > .w-foot { margin-top: 8px; font-size: 11px; }
    @container card (min-width: 360px) and (min-height: 300px) { /* large cards: 20px sides, a little more air */
      .w-card > .w-head, .w-card > .w-body, .w-card > .w-foot { margin-inline: 4px; }
      .w-card > .w-head { margin-top: 4px; }
      .w-card > .w-foot { margin-bottom: 4px; }
    }
    /* Scrollbars: none unless content really overflows (JS sets overflow inline); then thin, arrowless, and visible only on hover. */
    .w-card :is(.w-body, .wx-cycle, .wx-hours, .wx-days, .wx-3h, .mu-wrap) { scrollbar-width: auto; }
    .w-card *::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
    .w-card *::-webkit-scrollbar-button, .w-card *::-webkit-scrollbar-corner { display: none; width: 0; height: 0; }
    .w-card *::-webkit-scrollbar-track { background: transparent; }
    .w-card *::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 999px; background: transparent; background-clip: padding-box; }
    .w-card *:hover::-webkit-scrollbar-thumb { background-color: var(--faint); }
    .w-card .wx-hours, .w-card .wx-days { overflow: hidden; }
    /* Lists: a whole-row rhythm on 8px, rows that the card can hold are shown (the old size-based hiding is now measured), and "+N more". */
    .w-card .w-row.later, .w-card .w-row.far { display: flex; }
    .w-card .w-day.later { display: block; }
    .w-list { margin: 0 -8px; }
    .w-row { gap: 8px; padding: 6px 8px; }
    .w-day { padding: 12px 8px 4px; }
    .w-day:first-child { padding-top: 0; }
    .w-fit-more { display: block; margin: 0; padding: 8px 0 0; color: var(--muted); font-size: 11.5px; text-decoration: none; outline: none; border-radius: 4px; }
    a.w-fit-more:hover { color: var(--text); text-decoration: underline; text-underline-offset: 2px; }
    .w-fit-more:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
    /* Weather sections sit on the same 8px steps. */
    .wx-details { margin-bottom: 8px; }
    .wx-days { padding-top: 8px; }
  </style>
</head>
<body data-bg="plain">
  <div id="backdrop" aria-hidden="true"></div>
  <main>
    <header>
      <div class="clock-card" id="clock-card">
        <p class="clock" id="clock" hidden></p>
        <p class="date" id="date"></p>
      </div>
      <div class="greet">
        <h1 id="greeting">Hello</h1>
        <button class="w-icon-btn hdr-edit" id="hdr-edit" type="button" aria-label="Edit clock and greeting" title="Edit"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.6 2.2l2.2 2.2L4.2 10H2v-2.2z"/></svg></button>
      </div>
    </header>
    <form action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75"/><path d="m10.6 10.6 3.4 3.4"/></svg>
      <input id="q" name="q" autocomplete="off" placeholder="Search Google" aria-label="Search Google" aria-keyshortcuts="/ Control+/ Alt+A" />
      <kbd aria-hidden="true">/</kbd>
      <div class="mode" id="mode" role="radiogroup" aria-label="What the field does">
        <button type="button" role="radio" id="mode-search" data-mode="search" aria-checked="true" tabindex="0">Search</button>
        <button type="button" role="radio" id="mode-ask" data-mode="ask" aria-checked="false" tabindex="-1">Ask AI</button>
      </div><span class="mode-hint" id="mode-hint" role="status" aria-live="polite">Ctrl+/ to switch</span>
    </form>
    <div id="sections"></div>
  </main>
  <div id="widgets" class="widgets" role="region" aria-label="Widgets"></div>
  <script src="favicons.js"></script>
  <script src="../features/widget-layout.js"></script>
  <script src="../features/widget-stacks.js"></script>
  <script src="../features/widget-stack-motion.js"></script>
  <script src="../features/widget-system.js"></script>
  <script src="../features/widget-edit.js"></script>
  <script src="../features/widget-colors.js"></script>
  <script src="../features/widget-card-key.js"></script>
  <script src="../features/clock-styles.js"></script>
  <script src="newtab-system.js"></script>
  <script src="../features/worldclock-view.js"></script>
  <script src="../features/tradingview-fit.js"></script>
  <script src="newtab-widgets.js"></script>
  <script src="newtab-setup.js"></script>
  <script src="newtab-widgets-grid.js"></script>
  <script src="newtab-stacks.js"></script>
  <script src="newtab-edit.js"></script>
  <script src="newtab.js"></script>
  <script src="newtab-drift.js"></script>
  <script src="newtab-scrollbar.js"></script>
</body>
</html>
