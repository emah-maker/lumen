<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:" />
  <title data-i18n="mission.title">AI activity</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="managers.css" />
  <link rel="stylesheet" href="mission.css" />
</head>
<body>
  <main>
    <header>
      <h1 data-i18n="mission.title">AI activity</h1>
    </header>
    <p class="lede" data-i18n="mission.lede">Everything the AI is doing: chats, background tasks, routines and outside agents.</p>
    <section id="needs" aria-labelledby="needs-h">
      <h2 id="needs-h" data-i18n="mission.needs">Needs you</h2>
      <div id="needs-list" aria-live="polite" aria-relevant="additions removals"></div>
    </section>
    <section id="running" aria-labelledby="running-h">
      <h2 id="running-h" data-i18n="mission.running">Running now</h2>
      <div id="running-list"></div>
    </section>
    <section id="scheduled" aria-labelledby="scheduled-h">
      <h2 id="scheduled-h" data-i18n="mission.scheduled">Scheduled</h2>
      <div id="scheduled-list"></div>
    </section>
    <section id="recent" aria-labelledby="recent-h">
      <h2 id="recent-h" data-i18n="mission.recent">Recent</h2>
      <div id="recent-list"></div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script src="i18n.js"></script>
  <script src="mission.js"></script>
</body>
</html>
