<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'" />
  <title data-i18n="safeBrowsing.pageTitle">Security warning</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="interstitial danger">
  <main>
    <h1 id="title">This site may be dangerous</h1>
    <p class="note" id="summary"></p>
    <p class="note"><a id="learn" target="_blank" rel="noopener" data-i18n="safeBrowsing.learn" href="https://developers.google.com/search/docs/monitor-debug/security/malware">Learn more about this warning</a></p>
    <div class="actions">
      <button class="primary" id="back" type="button" data-i18n="safeBrowsing.back">Back to safety</button>
      <a id="advanced" href="#" data-i18n="safeBrowsing.advanced">Advanced</a>
    </div>
    <div id="details" hidden>
      <p class="note" id="lead">Google Safe Browsing lists <strong id="host"></strong> as possibly unsafe. Lists like this can be wrong: some safe sites are flagged by mistake, and some unsafe sites aren't listed.</p>
      <p class="note"><a id="continue" href="#" data-i18n="safeBrowsing.continue">Visit this site anyway (unsafe)</a></p>
    </div>
    <p class="attribution"><a target="_blank" rel="noopener" data-i18n="safeBrowsing.advisory" href="https://developers.google.com/safe-browsing/v4/advisory">Advisory provided by Google</a></p>
  </main>
  <script src="i18n.js"></script>
  <script src="interstitial.js"></script>
  <script src="safe-browsing.js"></script>
</body>
</html>
