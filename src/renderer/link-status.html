<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <style>
    :root { color-scheme: light dark; --surface: #ffffff; --border: rgba(0, 0, 0, 0.14); --text: #1d1d1f; }
    @media (prefers-color-scheme: dark) { :root { --surface: #2c2c2e; --border: rgba(255, 255, 255, 0.16); --text: #f5f5f7; } }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { font: 12px/22px -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; cursor: default; }
    /* The view is exactly as large as this bubble (main.js estimates the width from the text). */
    #bubble { box-sizing: border-box; height: 100%; padding: 0 10px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; background: var(--surface); border-radius: 6px; box-shadow: 0 0 0 0.5px var(--border), 0 2px 8px rgba(0, 0, 0, 0.18); animation: in 120ms ease-out; }
    @keyframes in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #bubble { animation: none; } }
  </style>
</head>
<body>
  <div id="bubble" aria-hidden="true"></div>
  <script src="link-status.js"></script>
</body>
</html>
